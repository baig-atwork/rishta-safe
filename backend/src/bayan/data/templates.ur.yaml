    glossary: [natural_frequency]
    text: "حمل کے لیے اس نتیجے کا کیا مطلب ہو سکتا ہے، وہ نیچے دیا گیا ہے۔ نیچے ہر گروپ {denominator} حمل میں سے گنا گیا ہے۔"

