    glossary: [gene, affected]
    text: "رپورٹ میں آپ دونوں میں سے ہر ایک کے لیے {gene} جین کی دونوں کاپیوں میں تبدیلیاں درج ہیں۔ کونسلر سمجھائیں گے کہ آپ کے لیے اس کا کیا مطلب ہے۔"

  shared.basis.x_linked_carrier_female:
