    glossary: [panel, detection_rate]
    source: "DoH Abu Dhabi Premarital Screening Standard V3, App. 15 footnote: couples must be informed that the screening does not cover or detect all genetic disorders"
    text: "یہ ٹیسٹ جینز کی ایک منتخب فہرست دیکھتا ہے۔ یہ ہر جین کی ہر تبدیلی نہیں ڈھونڈتا، اور ہر موروثی بیماری کا احاطہ بھی نہیں کرتا۔"

  limits.detection.generic:
    kind: paragraph
    polarity: neutral
    glossary: [detection_rate]
    text: "اس ٹیسٹ کی شناخت کی شرح (detection rate): {detection_rate_label}۔ شناخت کی شرح بتاتی ہے کہ جو تبدیلی واقعی موجود ہو، ٹیسٹ اسے کتنی بار پکڑ لیتا ہے۔ کوئی ٹیسٹ ہر تبدیلی نہیں ڈھونڈتا۔"

  limits.detection.panel_rate_assumed:
    kind: paragraph
    polarity: neutral
    glossary: [detection_rate]
    source: "genetics/detection.py statement key detection.panel_rate_assumed; the rate is assumed and illustrative (data/panels.yaml)"
    text: "اس ٹیسٹ کی شناخت کی شرح: ان جینز میں معلوم تبدیلیوں میں سے تقریباً {rate_den} میں سے {rate_num}۔ یہ شرح فرضی اور مثالی ہے۔ یہ ناپی ہوئی شرح نہیں ہے۔ کوئی ٹیسٹ ہر تبدیلی نہیں ڈھونڈ سکتا۔"

  limits.detection.alpha_globin_locus_limit:
    kind: paragraph
    polarity: neutral
    glossary: [detection_rate]
    source: "genetics/detection.py statement key detection.alpha_globin_locus_limit; the rate is assumed and illustrative (data/panels.yaml)"
    text: "الفا گلوبن جینز کے لیے شناخت کی شرح تقریباً {rate_den} میں سے {rate_num} ہے۔ یہ شرح فرضی اور مثالی ہے، ناپی ہوئی نہیں۔ ڈی این اے کا یہ حصہ تکنیکی طور پر جانچنا مشکل ہے۔"

  limits.detection.related_couple_shared_misses:
    kind: paragraph
    polarity: neutral
    glossary: [detection_rate]
    source: "genetics/detection.py statement key detection.related_couple_shared_misses; the rate is assumed and illustrative (data/panels.yaml)"
    text: "شناخت کی شرح تقریباً {rate_den} میں سے {rate_num} ہے (فرضی)۔ چونکہ آپ دونوں آپس میں رشتہ دار ہیں، اس لیے امکان ہے کہ جو تبدیلی یہ ٹیسٹ نہ پکڑ سکے وہ آپ دونوں میں نہ پکڑی جائے۔"

  limits.detection.assumed_note:
    kind: paragraph
    polarity: neutral
    text: "یہ شرح اس پروٹوٹائپ میں ایک مفروضے کے طور پر استعمال ہوئی ہے۔ کلینیکل سربراہ کی منظوری ابھی باقی ہے۔"

  limits.related_couple:
    kind: callout
    tone: care
    polarity: neutral
    glossary: [consanguinity, detection_rate]
    source: "Rishta Safe's own gene-dropping simulation (Rishta Safe authoring note, pending clinical sign-off): the naive independent update understates the chance by about 16 to 60 times for first cousins; ACMG advises reporting the detection rate, not a residual figure"
    text: "آپ آپس میں رشتہ دار ہیں، اس لیے اگر ٹیسٹ میں کوئی تبدیلی نہ ملے تو بھی امکان اس طرح کم نہیں ہوتا جیسے ان ساتھیوں کے لیے ہوتا ہے جو آپس میں رشتہ دار نہیں۔ ایک ہی بزرگ سے کوئی تبدیلی آپ دونوں تک پہنچ سکتی ہے، اور جو تبدیلی ٹیسٹ سے چھوٹ جائے وہ آپ دونوں میں چھوٹ جائے گی۔ اسی لیے ٹیسٹ میں کوئی تبدیلی نہ ملنے کے بعد کوئی چھوٹا عدد نہیں دکھایا جاتا۔"

  # ---------------------------------------------------------------- own and partner views
  own.heading:
    kind: heading
    polarity: neutral
    text: "آپ کی اپنی رپورٹ"

  own.finding.carrier:
    kind: item
    polarity: neutral
    glossary: [carrier]
    text: "آپ کی رپورٹ میں {gene} جین کی ایک بدلی ہوئی کاپی درج ہے۔ اس کا مطلب ہے کہ آپ اس جین کے کیریئر ہیں۔"

  own.finding.affected:
    kind: item
    polarity: neutral
    glossary: [affected]
    text: "آپ کی رپورٹ میں {gene} جین میں ایسی تبدیلیاں درج ہیں جو کسی بیماری سے جڑی ہیں۔ کونسلر سمجھائیں گے کہ آپ کے لیے اس کا کیا مطلب ہے۔ یہ صفحہ تشخیص نہیں دے سکتا۔"

  own.finding.vus:
    kind: item
    polarity: neutral
    glossary: [vus]
    text: "آپ کی رپورٹ میں {gene} جین میں ایک ایسی تبدیلی درج ہے جس کا مطلب ابھی واضح نہیں۔ اسے نتیجے میں شمار نہیں کیا جاتا۔"

  own.finding.not_detected:
    kind: item
    polarity: neutral
    text: "اس ٹیسٹ میں {gene} جین میں کوئی تبدیلی نہیں ملی۔ براہِ کرم نیچے ٹیسٹ کی حدود دیکھ لیں۔"

  partner.heading:
    kind: heading
    polarity: neutral
    text: "آپ کے ساتھی کی رپورٹ"

  partner.none:
    kind: paragraph
    polarity: neutral
    text: "آپ جوڑے کا نتیجہ دیکھ سکتے ہیں۔ آپ کے ساتھی کی اپنی رپورٹ آپ کو تب تک نہیں دکھائی جاتی جب تک آپ کے ساتھی رضامند نہ ہوں۔"

  partner.gene_only:
    kind: item
    polarity: neutral
    text: "آپ کے ساتھی کی رپورٹ میں {gene} جین کا ذکر ہے۔"

  partner.variant_unknown:
    kind: item
    polarity: neutral
    text: "تبدیلی کا نام درج نہیں"

  partner.full.carrier:
    kind: item
    polarity: neutral
    glossary: [carrier]
    text: "آپ کے ساتھی کی رپورٹ میں {gene} جین کی ایک بدلی ہوئی کاپی درج ہے ({variant})۔"

  partner.full.affected:
    kind: item
    polarity: neutral
    glossary: [affected]
    text: "آپ کے ساتھی کی رپورٹ میں {gene} جین میں ایسی تبدیلیاں درج ہیں جو کسی بیماری سے جڑی ہیں ({variant})۔"

  partner.full.vus:
    kind: item
    polarity: neutral
    glossary: [vus]
    text: "آپ کے ساتھی کی رپورٹ میں {gene} جین میں ایک ایسی تبدیلی درج ہے جس کا مطلب ابھی واضح نہیں ({variant})۔"

  partner.full.not_detected:
    kind: item
    polarity: neutral
    text: "آپ کے ساتھی کی رپورٹ میں {gene} جین میں کوئی تبدیلی درج نہیں ({variant})۔"

  # ---------------------------------------------------------------- privacy, policy, certificate
  privacy.heading:
    kind: heading
    polarity: neutral
    text: "کون دیکھ سکتا ہے"

  privacy.who_can_see:
    kind: paragraph
    polarity: neutral
    source: "Federal Decree-Law 49/2023, Art. 9(1) and Art. 19 to 21"
    text: "آپ اپنا نتیجہ دیکھ سکتے ہیں۔ آپ کے ساتھی تفصیلات تب ہی دیکھ سکتے ہیں جب آپ رضامند ہوں۔ ملازمت دینے والے ادارے اور انشورنس کمپنیاں جینیاتی نتائج مانگ نہیں سکتیں اور انہیں استعمال بھی نہیں کر سکتیں (وفاقی فرمانِ قانون نمبر {law_number}/{law_year}، دفعہ {art_19} سے {art_21} تک)۔"

  privacy.state_recipient:
    kind: paragraph
    polarity: neutral
    source: "Federal Decree-Law 49/2023, Art. 26(2)"
    text: "قانون اسکریننگ سینٹرز سے تقاضا کرتا ہے کہ وہ اسکریننگ کا ڈیٹا قومی جینوم ڈیٹا بیس کو بھیجیں (دفعہ {art_26} کی ذیلی شق {art_26_para})۔ یہ ٹول ڈیٹا کو صحت کے حکام سے نہیں چھپاتا۔"

  policy.abu_dhabi:
    kind: paragraph
    polarity: neutral
    source: "DoH Abu Dhabi Premarital Screening Standard V3, App. 2: the doctor meets both partners together after obtaining the consent of the person with the abnormal result"
    text: "ابوظہبی میں، جب کسی نتیجے میں کوئی بات سامنے آئے تو ڈاکٹر ساتھی کو بتانے سے پہلے اس شخص سے پوچھتے ہیں جس کا وہ نتیجہ ہے۔"

  policy.dubai:
    kind: paragraph
    polarity: neutral
    source: "DHA Standards for Premarital Screening Services V1, 9.1.4: disclosed exclusively to the affected individual; the partner only with explicit consent"
    text: "دبئی میں، جس نتیجے میں کوئی بات سامنے آئے وہ پہلے صرف اسی شخص کو بتایا جاتا ہے جس کا وہ نتیجہ ہے۔ ساتھی کو صرف اس شخص کی واضح رضامندی سے بتایا جاتا ہے۔"

  certificate.refusal_tension:
    kind: callout
    tone: care
    polarity: neutral
    source: "DoH Abu Dhabi Standard V3, 3.3.12.1; DHA Standard V1, 9.1.10b: the certificate is withheld if a partner refuses to share or sign"
    text: "ابوظہبی اور دبئی میں، اگر کوئی ایک ساتھی نتیجہ بتانے یا اقرار نامے پر دستخط کرنے سے انکار کرے تو شادی کے معاہدے کے لیے درکار رپورٹ جاری نہیں کی جا سکتی۔ اس طرح آپ کی رازداری کے انتخاب اور سرٹیفکیٹ آپس میں جڑے ہوئے ہیں۔ کونسلر سمجھا سکتے ہیں کہ آپ کے لیے اس کا کیا مطلب ہے۔"

  certificate.generic:
    kind: callout
    tone: care
    polarity: neutral
    text: "اس معاملے پر سرٹیفکیٹ سے متعلق ایک نوٹ لاگو ہوتا ہے۔ کونسلر اسے سمجھا سکتے ہیں۔"

  # ---------------------------------------------------------------- options pane
  options.heading:
    kind: heading
    polarity: neutral
    text: "موجود اختیارات"

  options.intro:
    kind: paragraph
    polarity: neutral
    text: "یہ وہ اختیارات ہیں جو موجود ہیں۔ انہیں ترجیح کی کسی ترتیب سے نہیں لکھا گیا، اور ترتیب سب کے لیے ایک جیسی ہے۔ یہاں کوئی آپ کو یہ نہیں بتا رہا کہ آپ کون سا اختیار اپنائیں۔ کونسلر ہر ایک کی وضاحت کر سکتے ہیں۔"

  options.item.preimplantation:
    kind: item
    polarity: neutral
    source: "Federal Decree-Law 49/2023, Art. 11"
    text: "حمل شروع ہونے سے پہلے لائسنس یافتہ تولیدی مراکز میں ٹیسٹ، تاکہ موروثی بیماریوں کی نشاندہی ہو سکے اور ان سے بچاؤ ممکن ہو (دفعہ {art_11})۔"

  options.item.prenatal_diagnosis:
    kind: item
    polarity: neutral
    source: "Federal Decree-Law 49/2023, Art. 12"
    text: "حمل کے دوران ٹیسٹ، تاکہ معلوم ہو کہ بچے کو کوئی بیماری ہے یا نہیں۔ قانون اس کی اجازت دیتا ہے (دفعہ {art_12})۔ اگر کوئی سنگین بیماری سامنے آئے تو قانون کہتا ہے کہ نافذ قوانین کے مطابق طبی اختیارات دستیاب ہیں۔"

  options.item.specialist_discussion:
    kind: item
    polarity: neutral
    glossary: [genetic_counselling]
    text: "کسی ماہر سے نتیجے کے بارے میں بات کرنا: اس کا آپ کے خاندان کے لیے کیا مطلب ہے، اور کسی بھی حمل کے لیے اس کا کیا مطلب ہے۔"

  options.rights:
    kind: paragraph
    polarity: neutral
    glossary: [right_not_to_know]
    source: "Federal Decree-Law 49/2023, Art. 9(2)"
    text: "آپ اپنے کچھ یا تمام نتائج نہ جاننے کا انتخاب کر سکتے ہیں۔ یہ آپ کا حق ہے (وفاقی فرمانِ قانون نمبر {law_number}/{law_year}، دفعہ {art_9} کی ذیلی شق {art_9_para})۔ آپ بعد میں اپنا فیصلہ بدل سکتے ہیں۔"

  options.closing:
    kind: paragraph
    polarity: neutral
    text: "یہ ٹول آپ کی جگہ فیصلے نہیں کرتا۔ آپ کسی بھی وقت مدد مانگ سکتے ہیں۔"

  options.pointer:
    kind: paragraph
    polarity: neutral
    text: "“موجود اختیارات” کے نام سے ایک صفحہ ان اختیارات کی وضاحت کرتا ہے جن کی قانون اجازت دیتا ہے۔ یہ انہیں ترجیح کی کسی ترتیب کے بغیر دکھاتا ہے۔"
