    polarity: shared
    glossary: [x_linked, carrier, gene]
    text: "{gene} جین X کروموسوم پر ہے۔ خاتون ساتھی میں اس کی ایک بدلی ہوئی کاپی ہے۔ اس کا اثر بیٹوں اور بیٹیوں پر مختلف طرح سے ہو سکتا ہے۔"

  shared.basis.x_linked_affected_male:
    kind: paragraph
    polarity: shared
    glossary: [x_linked, gene, affected]
    text: "{gene} جین X کروموسوم پر ہے۔ مرد ساتھی کے اس جین میں تبدیلی ہے۔ اس کا اثر بیٹیوں اور بیٹوں پر مختلف طرح سے ہو سکتا ہے۔"

  shared.outcomes.intro:
    kind: paragraph
