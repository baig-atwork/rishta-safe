# Explainer templates, Urdu (اردو). Draft translation of templates.en.yaml (adapted, not word for word).
#
# Rules are the same as for the English file (enforced by tests/explain):
#   * Slots are written {name} and are copied byte for byte from the English template.
#   * No digit is typed into the text. Numbers arrive only through slots.
#   * No banned word (templates.banned.yaml, `en` and `ur` lists).
#   * Same template ids, same slots, same kind/tone/polarity/glossary/source as English.
#
# Status: needs_clinician_signoff: true. language_status: draft. This Urdu text was drafted with an
# LLM assistant and has NOT been read by a native clinical reader. Nobody has reviewed the wording.
# The clinical lead (sign-off pending) flips language_status only once a real sign-off exists.
meta:
  schema_version: 1
  locale: ur
  direction: rtl
  digit_system: western
  language_status: draft
  needs_clinician_signoff: true
  authoring: >-
    Static text. Drafted at authoring time with an LLM assistant (no personal or couple data was
    given to it). It is a draft that has not been reviewed by a native clinical reader of Urdu.
    There is no runtime LLM (ADR 0003).
  wording_basis: >-
    Non-stigmatising, non-directive. Words the official materials use that this product avoids:
    compatible, non-compatible, abnormal, positive findings, high-risk marriage (Rishta Safe authoring note, pending clinical sign-off). Official wording kept: carrier, shared genetic change, detection limits.

engine_slots: [gene, genes, per_100, affected, carrier, neither, detection_rate_label, variant, shared_count, rate_num, rate_den]

# Short Urdu phrases that identify each result category in rendered text. Each phrase occurs verbatim
# in at least one template of its own category and in no template of another category.
polarity_markers:
  shared:
    - "مشترک نتیجہ ملا"
    - "ایسا نتیجہ جو آپ دونوں میں مشترک ہے"
    - "موروثی بیماری والے بچے کے امکان"
    - "جین کی تبدیلی کے کیریئر ہیں"
  no_shared:
    - "کوئی مشترک تبدیلی نہیں ملی"
    - "آپ دونوں میں ایک ہی جین میں ہو"
  more_info:
    - "مزید معلومات درکار ہیں"
    - "واضح جواب نہیں دے سکتی"

templates:
  # ---------------------------------------------------------------- notices on every document
  status.draft_notice:
    kind: callout
    tone: info
    polarity: neutral
    text: "یہ وضاحت ایک مسودہ ہے۔ کلینیکل سربراہ کی منظوری ابھی باقی ہے۔"

  status.synthetic_notice:
    kind: callout
    tone: info
    polarity: neutral
    text: "یہ ایک نمونہ (پروٹوٹائپ) ہے جس میں فرضی (synthetic) ڈیٹا استعمال ہوا ہے۔ یہ کوئی طبی آلہ نہیں ہے اور نہ ہی کوئی طبی خدمت۔"

  boundary.education_decision_support:
    kind: disclaimer
    tone: care
    polarity: neutral
    source: "Rishta Safe scope rules (docs/spec/00-architecture-and-scope.md, rule 10); Challenge 03 requirement 3 (boundary between education, decision support and clinical advice)"
    text: "یہ صفحہ معلومات اور فیصلے میں مدد کے لیے ہے۔ یہ طبی مشورہ نہیں ہے۔ پیچیدہ یا بڑے اثر والے نتائج کی وضاحت کوئی تسلیم شدہ ماہرِ صحت کرتے ہیں، جیسے جینیاتی کونسلر یا تربیت یافتہ ڈاکٹر۔"

  # ---------------------------------------------------------------- result: shared
  result.shared.heading:
    kind: heading
    polarity: shared
    text: "مشترک نتیجہ ملا ہے"

  result.shared.summary:
    kind: paragraph
    polarity: shared
    glossary: [shared_result, carrier]
    text: "اسکریننگ رپورٹ میں ایسا نتیجہ جو آپ دونوں میں مشترک ہے سامنے آیا ہے۔ اس سے موروثی بیماری والے بچے کے امکان کا اشارہ ملتا ہے۔ یہ امکان کی بات ہے۔ یہ آپ دونوں میں سے کسی کی تشخیص نہیں ہے۔"

  shared.basis.both_carriers:
    kind: paragraph
    polarity: shared
    glossary: [carrier, gene]
    text: "آپ دونوں {gene} جین کی تبدیلی کے کیریئر ہیں۔ کیریئر کے پاس جین کی ایک بدلی ہوئی کاپی ہوتی ہے۔ زیادہ تر کیریئر افراد میں کوئی علامت نہیں ہوتی۔"

  shared.basis.affected_partner_and_carrier:
    kind: paragraph
    polarity: shared
    glossary: [carrier, gene, affected]
