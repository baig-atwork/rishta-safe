# Pathway texts, Urdu. Same keys as pathway.en.yaml.
# Every outside system label ends with the simulated marker (فرضی (سمولیٹڈ)).
# Status: needs_clinician_signoff: true; language_status: draft (no native clinical reader has looked at this wording).
meta:
  schema_version: 1
  locale: ur
  direction: rtl
  language_status: draft
  needs_clinician_signoff: true
  authoring: "Urdu draft of static text, drafted at authoring time with an LLM assistant. No personal data was given to the assistant. No native clinical reader has reviewed it. No runtime LLM."

notices:
  simulated: "اس صفحے پر دکھایا گیا ہر بیرونی نظام فرضی (سمولیٹڈ) ہے۔ کچھ بک، ارسال یا جاری نہیں ہوتا۔"
  synthetic: "اس نمونے (پروٹوٹائپ) میں تمام لوگ اور نتائج فرضی ہیں (مصنوعی ڈیٹا)۔"
  draft: "یہ عنوانات ابتدائی مسودہ ہیں۔ کلینیکل سربراہ کے دستخط ابھی باقی ہیں۔"
  certificate_expired: "یہاں دکھائی گئی سرٹیفکیٹ کی تاریخیں ختم ہو چکی ہیں۔ نیا سرٹیفکیٹ درکار ہو گا۔"
  certificate_valid_until: "اس تاریخ تک معتبر"
  preliminary_risk_off: "ابتدائی اندازہ نہیں مانگا گیا۔"
  preliminary_risk_unavailable: "ابتدائی اندازہ مانگا گیا تھا، مگر اس ورژن میں اس کا کوئی ذریعہ نہیں ہے۔ کچھ نہیں دکھایا جا رہا۔"
  stale_task: "اس کام میں بہت دیر سے کوئی تبدیلی نہیں ہوئی۔ اسے یہاں اس لیے دکھایا گیا ہے کہ یہ گم نہ ہو جائے۔"
  standard_illustrative: "یہ وقت کی حد صرف مثال کے لیے ہے۔ کوئی شائع شدہ معیار ایسی حد نہیں بتاتا۔"

steps:
  registered:
    label: "جانچ کی ملاقات کا وقت لینا"
    description: "آپ دونوں لائسنس یافتہ جانچ مرکز اور وقت چنتے ہیں۔ اس نمونے میں بکنگ فرضی (سمولیٹڈ) ہے اور کچھ بک نہیں ہوتا۔"
  consult_completed:
    label: "رضامندی اور ڈاکٹر سے ملاقات"
    description: "آپ رضامندی کے فارم پر دستخط کرتے ہیں اور ڈاکٹر سے ملتے ہیں، ہر ساتھی الگ الگ۔ ڈاکٹر آپ کی صحت اور خاندان کے بارے میں پوچھتا ہے۔"
  sample_collected:
    label: "خون کا نمونہ"
    description: "تربیت یافتہ شخص اسی ملاقات کے دوران مرکز میں خون لیتا ہے۔ نمونے لیبارٹریوں کو بھیجے جاتے ہیں۔"
  lab_started:
    label: "لیبارٹری کا کام شروع"
    description: "لیبارٹری نمونہ وصول کرتی ہے اور ٹیسٹ شروع کرتی ہے۔"
  joint_report_ready:
    label: "مشترکہ رپورٹ تیار ہے"
    description: "جوڑے کے لیے ایک مشترکہ رپورٹ بنتی ہے اور ڈاکٹر کو بھیجی جاتی ہے۔ جینیاتی حصے میں باقی ٹیسٹوں سے زیادہ وقت لگتا ہے۔"
  result_communicated:
    label: "نتیجہ سمجھایا جاتا ہے"
    description: "ڈاکٹر نتیجہ بتاتا ہے۔ ہر ساتھی سے الگ بھی رابطہ ہو سکتا ہے۔"
  counselling_booked:
    label: "کاؤنسلنگ کا وقت لیا جاتا ہے"
    description: "اگر نتیجے کی وجہ سے ضرورت ہو تو کاؤنسلنگ کی ملاقات رکھی جاتی ہے۔ آپ «نہیں، شکریہ» بھی کہہ سکتے ہیں۔"
  counselling_completed:
    label: "کاؤنسلنگ مکمل"
    description: "تربیت یافتہ ماہر نتیجہ اور موجود اختیارات سمجھاتا ہے۔ وہ آپ کو یہ نہیں بتاتا کہ آپ کیا فیصلہ کریں۔"
  declaration_signed:
    label: "اقرار نامے پر دستخط"
    description: "آپ ایک بیان پر دستخط کرتے ہیں کہ نتیجہ آپ کو سمجھا دیا گیا ہے۔"
  certificate_issued:
    label: "سرٹیفکیٹ جاری ہوتا ہے"
    description: "شادی کے معاہدے کے لیے درکار جانچ کی رپورٹ جاری کی جاتی ہے۔ یہ محدود مدت کے لیے معتبر ہوتی ہے۔"
  judicial_handoff_sent:
    label: "رپورٹ عدالتی محکمے کو جاتی ہے"
    description: "رپورٹ عدالتی محکمے کو دستیاب کر دی جاتی ہے۔ اس نمونے میں یہ حوالگی فرضی (سمولیٹڈ) ہے۔"
  case_closed:
    label: "کیس بند ہوتا ہے"
    description: "اگلے مراحل مکمل ہو چکے ہیں یا ان سے انکار کیا گیا ہے، اور کیس بند ہو جاتا ہے۔"

