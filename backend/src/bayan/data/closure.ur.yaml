    recontact: "دوبارہ رابطہ کرنا"

patient_items:
  own_words:
    prompt: "اپنے الفاظ میں بتائیں، اس نتیجے کا آپ دونوں کے لیے کیا مطلب ہے؟"
  out_of_100:
    prompt: "اسی نتیجے والے جوڑوں کے {denominator} حمل میں سے، تقریباً کتنے بچوں کو یہ حالت ہو گی؟"
  carrier_is_disease:
    prompt: "کیریئر ہونے کا مطلب ہے کہ اس شخص کو بیماری ہے۔"
  negative_means_none:
    prompt: "اگر ٹیسٹ میں کوئی مشترکہ تبدیلی نہ ملے تو ہمارے بچوں کو کوئی موروثی حالت ہو ہی نہیں سکتی۔"
  next_step:
    prompt: "اگلا قدم کیا ہے، اور اس کی ذمہ داری کس کی ہے؟"
    options:
      counsellor_explains: "کاؤنسلر یا ڈاکٹر ہمیں نتیجہ اور اختیارات سمجھاتا ہے"
      centre_decides: "جانچ کا مرکز ہماری جگہ فیصلہ کرتا ہے"
      nothing_more: "اس کے بعد کچھ نہیں ہوتا"
      find_lab_yourself: "ہم خود کوئی لیبارٹری ڈھونڈتے ہیں"
  values_clarity:
    prompt: "مجھے معلوم ہے کہ آگے کا قدم طے کرتے وقت ہمارے لیے سب سے اہم بات کیا ہے۔"
  felt_free:
    prompt: "مجھے فیصلے کی آزادی محسوس ہوئی۔ کسی نے ہمیں کسی خاص سمت میں نہیں دھکیلا۔"
  who_can_see:
    prompt: "ہمارا نتیجہ کون دیکھ سکتا ہے؟"
    options:
      only_me: "صرف میں"
      me_and_partner: "میں اور میرا ساتھی"
      family_i_choose: "خاندان کے وہ افراد جنہیں میں چنوں"
      nobody_else: "میرے علاوہ کوئی نہیں"

sils:
  prompt: "جب آپ کو اپنے ڈاکٹر یا دوا خانے سے ملی ہوئی ہدایات، پمفلٹ یا دوسری تحریری چیزیں پڑھنی ہوں تو کتنی بار آپ کو کسی کی مدد کی ضرورت پڑتی ہے؟"
  options:
    never: "کبھی نہیں"
    rarely: "بہت کم"
    sometimes: "کبھی کبھی"
    often: "اکثر"
    always: "ہمیشہ"
  attribution: "یہ سوال «سنگل آئٹم لٹریسی اسکرینر» (موریس اور دیگر) سے لیا گیا ہے اور کریئیٹو کامنز ایٹری بیوشن لائسنس (CC BY) کے تحت استعمال ہوتا ہے۔ یہ اردو الفاظ ابتدائی مسودہ ترجمہ ہیں جن کی کوئی تصدیق نہیں ہوئی۔"

service_interest:
  prompt: "کیا آپ حمل کی منصوبہ بندی کی خدمات کے بارے میں معلومات چاہتے ہیں؟"
  consent_text: "ہم آپ کو حمل کی منصوبہ بندی کی خدمات کے بارے میں معلومات بھیج سکتے ہیں، جب آپ کے لیے مناسب وقت ہو۔ مثلاً: حمل سے پہلے کاؤنسلنگ، ساتھی یا رشتہ داروں کا ٹیسٹ، اور خاندان شروع کرنے کے اختیارات۔ یہ آپ کی اپنی مرضی ہے۔ آپ کے جواب سے آپ کا نتیجہ نہیں بدلتا۔ اس سروس کے ذریعے یہ جواب آپ کے ساتھی، خاندان، ملازمت دینے والے ادارے یا انشورنس کمپنی کو نہیں دکھایا جاتا، اور ہم یہ ریکارڈ نہیں کرتے کہ آپ شادی کا ارادہ رکھتے ہیں یا نہیں۔ آپ «ابھی نہیں» یا «نہیں، شکریہ» کہہ سکتے ہیں، اور کسی بھی وقت اپنا ارادہ بدل سکتے ہیں۔ اگر آپ ہاں کہیں تو ہم صرف رابطے کا وہی طریقہ استعمال کریں گے جو آپ چنیں، اور صرف یہی معلومات بھیجنے کے لیے۔"
  values:
    yes_now: "جی ہاں، ابھی"
    yes_later: "جی ہاں، بعد میں (مجھے یاد دلائیں)"
    no_thanks: "نہیں، شکریہ"
    prefer_not_to_say: "مجھے جواب نہ دینا پسند ہے"
  reminder_prompt: "آپ کب یاد دہانی چاہیں گے؟ (اب سے کتنے مہینے بعد)"
  topics_prompt: "آپ کو کن موضوعات میں دلچسپی ہے؟"
  topics:
    preconception_counselling: "حمل سے پہلے کاؤنسلنگ"
    partner_or_relative_testing: "ساتھی یا رشتہ داروں کا ٹیسٹ"
    conception_options_information: "خاندان شروع کرنے کے اختیارات کے بارے میں معلومات"
    prenatal_testing_information: "حمل کے دوران ٹیسٹ کے بارے میں معلومات"
    talk_to_counsellor_again: "کاؤنسلر سے دوبارہ بات"

teachback:
  intro: "پانچ مختصر سوال، تاکہ معلوم ہو کہ وضاحت صاف تھی۔ یہ وضاحت کو جانچتے ہیں، آپ کو نہیں۔"
  results_note: "آپ کے جوابات ایک مختصر وضاحت کے ساتھ دکھائے جاتے ہیں۔ کم از کم نمبروں کی کوئی شرط نہیں۔"
  items:
    sr1:
      prompt: "مشترکہ نتیجے کا کیا مطلب ہے؟"
      options:
        a: "آپ دونوں کا ایک مشترکہ نتیجہ ہے جو ایسے بچے کے امکان کی طرف اشارہ کرتا ہے جسے کوئی موروثی حالت ہو"
        b: "آپ میں سے ایک اس وقت بیمار ہے"
        c: "شادی کی اجازت نہیں ہے"
      explanation: "مشترکہ نتیجہ بچے کے امکان کی طرف اشارہ کرتا ہے۔ یہ کسی ایک ساتھی کی تشخیص نہیں ہے، اور نہ ہی شادی کے بارے میں کوئی حکم ہے۔"
    sr2:
      prompt: "کیریئر ہونے کا مطلب ہے کہ شخص بیمار ہے۔"
      explanation: "کیریئر میں جین کی ایک نقل بدلی ہوئی ہوتی ہے۔ زیادہ تر کیریئرز میں کوئی علامت نہیں ہوتی۔"
    sr3:
      prompt: "چارٹ میں {denominator} نشان دکھائے گئے ہیں۔ یہ کس کی نمائندگی کرتے ہیں؟"
      options:
        a: "اسی نتیجے والے جوڑوں کے {denominator} حمل"
        b: "ملک بھر کے {denominator} جوڑے"
        c: "وہ {denominator} بچے جو آپ کے ہوں گے"
      explanation: "چارٹ {denominator} حمل میں سے ہے۔ یہ ایک حمل کے امکان کو بیان کرتا ہے۔ یہ نہیں بتاتا کہ آپ کے کتنے بچے ہوں گے۔"
    sr4:
      prompt: "آگے کیا کرنا ہے، یہ کون طے کرتا ہے؟"
      options:
        a: "جانچ کا مرکز آپ کی جگہ طے کرتا ہے"
        b: "آپ دونوں طے کرتے ہیں، اور اگر آپ چاہیں تو کاؤنسلر کی مدد کے ساتھ"
        c: "آپ کے رشتہ دار طے کرتے ہیں"
      explanation: "فیصلہ آپ کا اپنا ہے۔ کاؤنسلر موجود اختیارات سمجھاتا ہے اور یہ نہیں بتاتا کہ آپ کیا فیصلہ کریں۔"
    sr5:
      prompt: "پیش کیا جانے والا اگلا قدم کون سا ہے؟"
      options:
        a: "جینیاتی کاؤنسلر یا تربیت یافتہ ڈاکٹر سے بات کرنا"
        b: "انتظار کرنا اور کسی کو نہ بتانا"
        c: "گھر پر ٹیسٹ دوبارہ کرنا"
      explanation: "کاؤنسلر نتیجہ اور اختیارات سمجھا سکتا ہے۔ جانچ لائسنس یافتہ مراکز میں ہوتی ہے، گھر پر نہیں۔"
    ns1:
      prompt: "«کوئی مشترکہ تبدیلی نہیں ملی» کا کیا مطلب ہے؟"
      options:
        a: "اس ٹیسٹ میں کوئی ایسا جین نہیں ملا جس میں آپ دونوں کے اندر تبدیلی ہو"
        b: "آپ کے بچوں کو کوئی موروثی حالت ہو ہی نہیں سکتی"
        c: "آپ میں سے کسی میں جین کی کوئی تبدیلی نہیں ہے"
      explanation: "یہ صرف اس ٹیسٹ کی بات ہے۔ ٹیسٹ جینز کی ایک چنی ہوئی فہرست دیکھتا ہے اور ہر تبدیلی نہیں ڈھونڈ سکتا۔ زیادہ تر لوگ جین کی کوئی نہ کوئی تبدیلی رکھتے ہیں۔"
    ns2:
      prompt: "اگر کوئی مشترکہ تبدیلی نہ ملے تو بچے کو کوئی موروثی حالت ہو ہی نہیں سکتی۔"
      explanation: "کوئی ٹیسٹ ہر تبدیلی نہیں ڈھونڈ سکتا، اس لیے یہ نتیجہ کوئی ضمانت نہیں ہے۔"
    ns3:
      prompt: "ٹیسٹ کسی تبدیلی کو پکڑنے سے کیوں رہ سکتا ہے؟"
      options:
        a: "وہ صرف جینز کی ایک چنی ہوئی فہرست دیکھتا ہے اور ہر تبدیلی نہیں ڈھونڈ سکتا"
        b: "ٹیسٹ سے کوئی تبدیلی کبھی نہیں چھوٹتی"
        c: "صرف لیبارٹری کی غلطی کی وجہ سے"
      explanation: "ہر ٹیسٹ کی کچھ حدیں ہوتی ہیں۔ اسی لیے شناخت کی شرح دکھائی جاتی ہے۔"
    ns4:
      prompt: "اگر ساتھی آپس میں رشتہ دار ہوں تو منفی ٹیسٹ امکان کو اسی طرح کم کرتا ہے جیسے ان ساتھیوں کے لیے جو آپس میں رشتہ دار نہیں ہیں۔"
      explanation: "رشتہ دار ساتھیوں کو ایک ہی تبدیلی کسی مشترکہ بزرگ سے مل سکتی ہے، اس لیے جو ٹیسٹ اسے نہ پکڑے وہ دونوں میں نہیں پکڑتا۔ اسی لیے کوئی چھوٹا عدد نہیں دکھایا جاتا۔"
    ns5:
      prompt: "آپ کا نتیجہ کون دیکھ سکتا ہے؟"
      options:
        a: "آپ، اور آپ کا ساتھی صرف تب جب آپ رضامند ہوں"
        b: "آپ کو ملازمت دینے والا ادارہ"
        c: "آپ کی انشورنس کمپنی"
