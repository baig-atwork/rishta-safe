# Closure texts, Urdu. Same keys as closure.en.yaml.
# Status: needs_clinician_signoff: true; language_status: draft (no native clinical reader has looked at this wording).
meta:
  schema_version: 1
  locale: ur
  direction: rtl
  language_status: draft
  needs_clinician_signoff: true
  authoring: "Urdu draft of static text, drafted at authoring time with an LLM assistant. No personal data was given to the assistant. No native clinical reader has reviewed it. No runtime LLM. Items are original wording, except the single literacy-screener question, a CC BY item whose Urdu wording is an unvalidated draft translation."

notices:
  not_run: "یہ صرف سوالنامہ اور طریقۂ کار ہے۔ لوگوں کے ساتھ سمجھنے کی جانچ ابھی نہیں کی گئی۔"
  synthetic: "یہاں کے جوابات صرف فرضی لوگوں (مصنوعی ڈیٹا) کے لیے ہیں۔ براہِ کرم اصلی صحت یا خاندان کی کوئی تفصیل درج نہ کریں۔"
  draft: "یہ تحریر ابتدائی مسودہ ہے۔ کلینیکل سربراہ کے دستخط ابھی باقی ہیں۔"
  item_level_only: "جوابات ہر سوال کے الگ الگ دکھائے جاتے ہیں۔ کوئی کل نمبر نہیں نکالا جاتا۔"
  optional_stratifier: "یہ سوال اختیاری ہے۔ یہ صرف گروہوں کا موازنہ کرنے میں مدد دیتا ہے۔ یہ پڑھنے کی صلاحیت کی جانچ نہیں ہے۔"

answer_labels:
  "true": "درست"
  "false": "غلط"
  not_sure: "یقین نہیں"
  prefer_not_to_say: "مجھے جواب نہ دینا پسند ہے"

scale_labels:
  likert_low: "بالکل متفق نہیں"
  likert_high: "پوری طرح متفق"

proforma:
  encounter: {label: "ملاقات", help: "تاریخ، ملاقات کا طریقہ، دورانیہ، زبان، اور یہ کہ ترجمان موجود تھا یا نہیں۔ اوقات سسٹم بھرتا ہے، آپ ان کی تصدیق کرتے ہیں۔"}
  risk_signal: {label: "نتیجہ جاری ہونے کا وقت", help: "سسٹم مراحل کے ریکارڈ سے خود بھرتا ہے۔"}
  findings_discussed: {label: "جن نتائج پر بات ہوئی", help: "ہر اس نتیجے پر نشان لگائیں جس پر بات ہوئی۔ یہ بھی درج کریں کہ اسے امکان کے طور پر سمجھایا گیا (تشخیص کے طور پر نہیں)، اور کیا وہ غیر یقینی تھا۔"}
  information_given: {label: "دی گئی معلومات", help: "ہر اس نکتے پر نشان لگائیں جو سمجھایا گیا۔"}
  options_discussed: {label: "جن اختیارات پر بات ہوئی", help: "ہر اس اختیار پر نشان لگائیں جو بیان کیا گیا۔ اختیارات ایک مقررہ، غیر جانبدار ترتیب میں درج ہیں۔ کسی ایک کی سفارش نہیں کی جاتی۔"}
  teach_back: {label: "جوڑے کا دوبارہ سمجھانا", help: "کیا جوڑے نے نتیجہ اپنے الفاظ میں دوبارہ بیان کیا؟ درج کریں کہ وہ کتنا درست تھا۔"}
  patient_questions: {label: "سوالات", help: "کیا سوال پوچھنے کی دعوت دی گئی، اور کیا ان کے جواب دیے گئے؟"}
  plan: {label: "منصوبہ", help: "ہر کام کا ایک ذمہ دار اور ایک آخری تاریخ ہوتی ہے۔"}
  referral_task: {label: "ریفرل کے کام", help: "سسٹم ریفرل کے کاموں سے خود بھرتا ہے۔"}
  service_preference: {label: "مستقبل کی خدمات", help: "یہ شخص کا اپنا اختیاری جواب ہے۔ اسے شخص خود بھرتا ہے، آپ نہیں۔"}
  sharing_and_consent: {label: "شیئرنگ اور رضامندی", help: "کیا شخص کو نقل دی گئی۔ رضامندی کا ریکارڈ سسٹم شامل کرتا ہے۔"}
  completed_by: {label: "مکمل کرنے والا", help: "سسٹم خود بھرتا ہے: آپ کا کردار اور وقت۔"}

