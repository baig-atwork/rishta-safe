    - {id: ar.mar.1, locale: ar, category: marriage_decision, pattern: 'هل (?:نتزوج|اتزوج|يتزوجان|نكمل الزواج|نستمر في الزواج|نتم الزواج|نمضي في الزواج|نواصل الزواج|يمكننا الزواج|يمكنني الزواج|يجوز لنا الزواج|يجوز ان نتزوج)'}
    - {id: ar.mar.2, locale: ar, category: marriage_decision, pattern: 'هل (?:الغي|نلغي|نفسخ|افسخ|نؤجل|اؤجل|ننهي|انهي) (?:ال)?(?:زواج|زواجنا|زواجي|خطوبتنا|خطوبتي|خطوبه|خطبه|زفاف|عرس|عقد|ارتباط)'}
    - {id: ar.mar.3, locale: ar, category: marriage_decision, pattern: '(?:الغاء|فسخ|تاجيل|انهاء|وقف) (?:ال)?(?:زواج|زواجنا|زواجي|خطوبتنا|خطوبتي|خطوبه|خطبه|زفاف|عرس|ارتباط)'}
