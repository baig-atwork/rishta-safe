# Disclosure policies, consent purposes and the refusal classifier data (lane B, governance).
#
# Status of everything in this file:
#   needs_clinician_signoff: true   (the clinical lead's sign-off is pending)
#   needs_legal_read: true          (statute readings are authoring notes, not a re-read
#                                    of the Decree-Law; see docs/decisions/0122 and 0123)
#   language_status: draft          (Arabic and Urdu strings were drafted at authoring time with an
#                                    LLM assistant; no native clinical reader has reviewed them)
#
# Sources (facts quoted by clause, no tables copied):
#   D1  DoH Abu Dhabi, Premarital Screening Standard, DoH/STD/PSS/V3, Sept 2024
#       https://doh.gov.ae/-/media/Feature/Resources/Standards/Premarital-Screening-standard-for-publication.ashx
#   D2  DHA Dubai, Standards for Premarital Screening Services, V1, DHA/PHPD/ST-01, effective 27 Mar 2026
#       https://dha.gov.ae/uploads/032026/Standards for Premarital Screening Services2026327321.pdf
#   DL  Federal Decree-Law 49/2023 on the Use of the Human Genome (the statute itself was not
#       re-read for this build)

meta:
  version: 1
  needs_clinician_signoff: true
  needs_legal_read: true
  language_status: draft

# --- Consent purposes (closed list; consent governs voluntary and secondary uses and SHARING) ---
# The mandatory couple screening itself is NOT consent-based (DL Art. 4(2)(a) and Art. 15), so it is
# not a purpose here: it is recorded with basis `statutory_obligation` and confers no sharing scope.
consent_purposes:
  partner_disclosure: "Share my findings with my partner, to the scope I choose"
  couple_counselling: "Share my findings with the counsellor or clinician for the couple's counselling"
  service_referral: "Share my findings with a referral service I choose"
  service_interest_follow_up: "Contact me about services I opted into"
  research_secondary_use: "Use my data for an extra purpose (DL Art. 7(5): fresh written consent)"

# Roles that may be named as a consent RECIPIENT. `programme`, `judge` and `external` never receive
# individual results (programme: aggregates only; judge: staff view of synthetic cases by role, not
# by grant; external: nothing), so a grant to them is refused rather than silently ignored.
recipient_roles_allowed: [couple_member, counsellor, clinician]

# --- Disclosure policies ---------------------------------------------------------------------
common:
  # Shared-condition bases whose result belongs to ONE person (an X-linked finding and an affected partner
  # need consent-gated display; flagged for a legal read).
  # Under EVERY policy the other partner sees the couple-level category only after the owner
  # has granted at least `couple_result_only`.
  individual_owned_shared_bases: [x_linked_carrier_female, x_linked_affected_male]
  # The life or fetal-life exception to the right not to know (DL Art. 9): the person's
  # app view stays withheld and a human accredited professional is escalated to make the statutory
  # disclosure with counselling. This is an interpretation; it is flagged for a legal read.
  rntk_override_trigger: rntk_life_threat_override

policies:
  abu_dhabi:
    label: "Abu Dhabi (DoH Premarital Screening Standard V3, Sept 2024)"
    # Joint report: one couple-level report; the couple-level category is released to BOTH partners
    # after post-test counselling. The affected individual's consent gates the joint counselling
    # meeting and what is shown about the partner's own findings (the per-person scope), not the
    # couple-level category itself.
    category_gate: joint_report
    counselling_first_categories: [shared_result_found, more_information_needed]
    certificate_note_key: certificate_note.abu_dhabi
    sources:
      - ref: "D1 App. 1b item 6"
        says: "positive results: both parties are contacted separately and asked to return to the clinic"
      - ref: "D1 App. 2"
        says: "after the affected individual consents, the doctor meets both partners together"
      - ref: "D1 App. 5a"
        says: "the joint genetic report states negative or positive only, without gene or variant detail, for the privacy of both parties"
      - ref: "D1 3.3.12.1"
        says: "the certificate is withheld if a partner refuses to share or sign (the certificate-refusal tension)"
  dubai:
    label: "Dubai (DHA Standards for Premarital Screening Services V1, effective 27 Mar 2026)"
    # Affected individual first: where a condition is found the result is disclosed exclusively to
    # the affected individual; the partner is informed only with that person's explicit consent.
    # Modelled here: the couple-level `shared_result_found` is withheld from a member until every
    # OTHER member who has an abnormal finding has granted at least `couple_result_only`.
    category_gate: affected_individual_first
    # The DHA text on counselling-before-release was not confirmed in the DHA text read for this build, so this list is a
    # product safeguard that mirrors Abu Dhabi (Art. 9 counselling after results); sign-off pending.
    counselling_first_categories: [shared_result_found, more_information_needed]
    certificate_note_key: certificate_note.dubai
    sources:
      - ref: "D2 9.1.4"
        says: "the result is disclosed exclusively to the affected individual; the partner is informed only with explicit consent"
      - ref: "D2 9.1.10b"
        says: "the certificate is withheld if a partner refuses to share or sign (the certificate-refusal tension)"

# --- Refusal classifier (EN, AR, UR) ----------------------------------------------------------
# Deterministic keyword and pattern matching on normalised text (text.normalize). It is NOT
# language understanding. Patterns of ALL locales are applied to every request (people code-switch);
# the locale only selects the language of the refusal message. Patterns are lower case and written
# without apostrophes. Arabic and Urdu patterns are folded with text.fold_pattern at load.
refusal:
  needs_clinician_signoff: true
  language_status: draft
  # What the product refuses (a refusal list plus other-person results).
  # `escalate`: the request cannot be answered safely, so a human counsellor is also notified
  # (design rule; no guideline text found).
  categories:
    diagnosis:
      escalate: false
      legal_basis: "Boundary: education and decision support, never clinical advice (docs/spec/00-architecture-and-scope.md, rule 10)"
      messages:
        en: "Rishta Safe explains a reported result. It cannot diagnose a condition for you or your child. A doctor or a genetics professional can talk this through with you."
        ar: "Rishta Safe يشرح نتيجة مُبلَّغ عنها، ولا يستطيع تشخيص حالة لك أو لطفلك. يمكن لطبيب أو لمختص في الوراثة أن يناقش ذلك معك."
        ur: "Rishta Safe رپورٹ شدہ نتیجے کی وضاحت کرتا ہے۔ وہ آپ یا آپ کے بچے کی کسی بیماری کی تشخیص نہیں کر سکتا۔ ڈاکٹر یا جینیات کے ماہر آپ کے ساتھ اس پر بات کر سکتے ہیں۔"
    treatment_advice:
      escalate: false
      legal_basis: "Boundary: education and decision support, never clinical advice (docs/spec/00-architecture-and-scope.md, rule 10)"
      messages:
        en: "Rishta Safe does not give advice about medicines or treatment. A doctor or a genetics professional can go through this with you."
        ar: "Rishta Safe لا يقدّم نصائح عن الأدوية أو العلاج. يمكن لطبيب أو لمختص في الوراثة أن يستعرض ذلك معك."
        ur: "Rishta Safe ادویات یا علاج کے بارے میں مشورہ نہیں دیتا۔ ڈاکٹر یا جینیات کے ماہر آپ کے ساتھ اس پر بات کر سکتے ہیں۔"
    marriage_decision:
      escalate: true
      legal_basis: "The decision to marry is for the couple and the judicial authorities (D1 App. 2); no marriage-decision field (docs/spec/00-architecture-and-scope.md, rule 6)"
      messages:
        en: "Rishta Safe does not advise on whether to marry or to change plans. That decision is yours, and a counsellor can talk through the information with you."
        ar: "Rishta Safe لا يقدّم نصيحة بشأن الزواج أو تغيير الخطط. القرار قرارك، ويمكن لمستشار أن يناقش المعلومات معك."
        ur: "Rishta Safe شادی کرنے یا منصوبہ بدلنے کے بارے میں مشورہ نہیں دیتا۔ یہ فیصلہ آپ کا اپنا ہے، اور کونسلر معلومات پر آپ کے ساتھ بات کر سکتا ہے۔"
    termination_advice:
      escalate: true
      legal_basis: "Neutral options only (Federal Decree-Law 49/2023 Art. 11 and 12); no directive advice"
      messages:
        en: "Rishta Safe cannot advise on a decision about a pregnancy. A genetics professional or a doctor can go through every available option with you, in a neutral way."
        ar: "Rishta Safe لا يستطيع تقديم نصيحة بشأن قرار يخص الحمل. يمكن لمختص في الوراثة أو لطبيب أن يستعرض معك كل الخيارات المتاحة بحيادية."
        ur: "Rishta Safe حمل سے متعلق فیصلے پر مشورہ نہیں دے سکتا۔ جینیات کا ماہر یا ڈاکٹر تمام دستیاب راستوں پر غیر جانب داری سے آپ کے ساتھ بات کر سکتا ہے۔"
    lineage_inference:
      escalate: true
      legal_basis: "DL Art. 9: lineage and racial-origin results only to the owner; breach is an offence (Art. 33)"
      messages:
        en: "Rishta Safe does not work out ancestry, family lineage or how people are related from genetic results. Decree-Law 49/2023 Art. 9 limits that kind of result to the person it belongs to."
        ar: "Rishta Safe لا يستنتج النسب أو الأصل أو صلة القرابة من النتائج الوراثية. المادة 9 من المرسوم بقانون اتحادي رقم 49 لسنة 2023 تقصر هذا النوع من النتائج على صاحبها."
        ur: "Rishta Safe جینیاتی نتائج سے نسب، خاندانی نسل یا رشتے داری کا اندازہ نہیں لگاتا۔ وفاقی فرمان بقانون 49/2023 کی شق 9 اس قسم کے نتائج کو صرف اسی شخص تک محدود رکھتی ہے جس کے وہ ہیں۔"
    employer_insurer:
      escalate: false
      legal_basis: "DL Art. 19 to 21: employers and insurers may not require genetic screening or request or use previous results"
      messages:
        en: "Employers and insurers may not require or use genetic results (Decree-Law 49/2023 Art. 19 to 21). Rishta Safe does not share results with them, and nobody has to share results with them."
        ar: "ليس لأصحاب العمل ولا لشركات التأمين أن يطلبوا النتائج الوراثية أو يستخدموها (المواد 19 إلى 21 من المرسوم بقانون اتحادي رقم 49 لسنة 2023). Rishta Safe لا يشارك النتائج معهم، ولا يُلزَم أحد بمشاركتها معهم."
        ur: "آجر اور بیمہ کمپنیاں جینیاتی نتائج مانگ نہیں سکتیں اور انہیں استعمال نہیں کر سکتیں (وفاقی فرمان بقانون 49/2023 کی شقیں 19 تا 21)۔ Rishta Safe ان کے ساتھ نتائج شیئر نہیں کرتا، اور کسی پر لازم نہیں کہ وہ انہیں شیئر کرے۔"
    other_person_result:
      escalate: true
      legal_basis: "DL Art. 9(1): each person may request their own results; no disclosure of another person's results without their consent"
      messages:
        en: "Rishta Safe shows each person their own results. What you can see about your partner follows what your partner chose to share."
        ar: "Rishta Safe يعرض لكل شخص نتائجه هو. وما يمكنك رؤيته عن شريكك يتبع ما اختار شريكك مشاركته."
        ur: "Rishta Safe ہر شخص کو اس کے اپنے نتائج دکھاتا ہے۔ آپ اپنے ساتھی کے بارے میں جو دیکھ سکتے ہیں وہ اس پر منحصر ہے جو آپ کے ساتھی نے شیئر کرنے کا انتخاب کیا ہے۔"

  patterns:
    # ---------------- English ----------------
    - {id: en.dx.1, locale: en, category: diagnosis, pattern: '\b(do|does|did) (i|we|he|she|they|my (?:child|baby|son|daughter|husband|wife|partner|fiance|fiancee|brother|sister)) (?:\w+ ){0,2}(have|has)\b.{0,40}\b(disease|disorder|thalass\w*|sickle|cystic|syndrome|anaemia|anemia|illness)\b'}
    - {id: en.dx.2, locale: en, category: diagnosis, pattern: '\bam i (sick|ill|diseased)\b'}
    - {id: en.dx.3, locale: en, category: diagnosis, pattern: '\bdiagnos(e|ing) (me|us|him|her|my|our|them)\b'}
    - {id: en.dx.4, locale: en, category: diagnosis, pattern: '\b(give|make|do) (me|us) a diagnosis\b'}
    - {id: en.dx.5, locale: en, category: diagnosis, pattern: '\bwhat (disease|illness|condition|disorder) (do|does) (i|we|he|she|they|my \w+) have\b'}
    - {id: en.dx.6, locale: en, category: diagnosis, pattern: '\bwhat is wrong with (me|my|our|him|her)\b'}
    - {id: en.dx.7, locale: en, category: diagnosis, pattern: '\btell me (if|whether) (i|we|he|she|my \w+) (am|are|is|have|has)\b.{0,30}\b(sick|ill|disease|disorder)'}
    - {id: en.dx.8, locale: en, category: diagnosis, pattern: '\bis (my|our|the) (child|baby|son|daughter|kid) (sick|ill|diseased)\b'}
    - {id: en.rx.1, locale: en, category: treatment_advice, pattern: '\bwhat (medicine|medication|drug|treatment|therapy|dose|dosage)\b.{0,30}\b(take|use|give|start|need)\b'}
    - {id: en.rx.2, locale: en, category: treatment_advice, pattern: '\b(prescribe|prescription)\b'}
    - {id: en.rx.3, locale: en, category: treatment_advice, pattern: '\bshould (i|we) (take|start|stop|give) (the |any |a )?(medic\w+|drug|pill|treatment|tablet)'}
    - {id: en.mar.1, locale: en, category: marriage_decision, pattern: '\bshould (we|i|they|he|she) (still |even |really )?(get married|marry|go ahead|go through with|call off|break off|cancel|postpone|continue|proceed|end it|separate|split)\b'}
    - {id: en.mar.2, locale: en, category: marriage_decision, pattern: '\b(call off|calling off|cancel|cancelling|canceling|break off|breaking off|postpone|postponing|end|ending|stop|stopping|drop|dropping|abandon|abandoning) (the |our |my |this |that )?(marriage|wedding|engagement|nikah|nikkah|betrothal|proposal)\b'}
    - {id: en.mar.3, locale: en, category: marriage_decision, pattern: '\b(is it|would it be|will it be) (ok|okay|alright|fine|wise|right|advisable|acceptable|allowed|permitted|a good idea) (for us )?to (get married|marry|go ahead|proceed|continue)\b'}
    - {id: en.mar.4, locale: en, category: marriage_decision, pattern: '\bcan (we|i|they) (still |safely |even )?(get married|marry|go ahead with (the|our) (marriage|wedding))\b'}
    - {id: en.mar.5, locale: en, category: marriage_decision, pattern: '\b(are|is|am) (we|he|she|they|i|my partner|my fiance|my fiancee)( \w+)? (compatible|incompatible|suitable|a good match|a match|a mismatch|fit to marry|fit for marriage)\b'}
    - {id: en.mar.6, locale: en, category: marriage_decision, pattern: '\bdo you (recommend|advise|suggest|think) (that )?(we|i|they) (should )?(marry|get married|cancel|call off|go ahead|proceed|separate)\b'}
    - {id: en.mar.7, locale: en, category: marriage_decision, pattern: '\bwill (we|they) be (allowed|able|permitted) to (get married|marry)\b'}
    - {id: en.mar.8, locale: en, category: marriage_decision, pattern: '\bis (this|our|the) (marriage|wedding|match) (ok|okay|wise|advisable|a good idea|right|safe)\b'}
    - {id: en.ter.1, locale: en, category: termination_advice, pattern: '\babort(ion|ed|ing)?\b'}
    - {id: en.ter.2, locale: en, category: termination_advice, pattern: '\b(terminate|terminating|termination|end|ending|stop|stopping|get rid of) (of )?(the |my |her |this |our |a )?(pregnancy|baby|fetus|foetus|unborn)\b'}
    - {id: en.ter.3, locale: en, category: termination_advice, pattern: '\bshould (i|we|she) (keep|continue|go ahead with|have|abort|terminate) (the |this |my |her |our )?(pregnancy|baby)\b'}
    - {id: en.ter.4, locale: en, category: termination_advice, pattern: '\b(keep|keeping|continue|continuing) (with )?(the |this |my |her |our )?(baby|pregnancy)\b'}
    - {id: en.lin.1, locale: en, category: lineage_inference, pattern: '\b(paternity|maternity|ancestry|ancestral|lineage|bloodline|ethnic origin|ethnic background|racial origin|tribal origin|tribe)\b'}
    - {id: en.lin.2, locale: en, category: lineage_inference, pattern: '\bwhos (my|the) (real |biological |true )?(father|mother|dad|parent)\b'}
    - {id: en.lin.3, locale: en, category: lineage_inference, pattern: '\b(are we|am i|is he|is she|are they) (really |genetically |biologically )?(related|cousins|kin|blood relatives)\b'}
    - {id: en.lin.4, locale: en, category: lineage_inference, pattern: '\b(prove|show|confirm|test|check) (that )?(we are|i am|he is|she is|they are)? ?(related|cousins|biological)'}
    - {id: en.lin.5, locale: en, category: lineage_inference, pattern: '\bis (this|the|my) (child|baby|kid|son|daughter) (really )?(mine|his|hers|ours)\b'}
    - {id: en.lin.6, locale: en, category: lineage_inference, pattern: '\b(biological|real|true) (father|mother|parent)\b'}
    - {id: en.emp.1, locale: en, category: employer_insurer, pattern: '\b(employer|boss|manager|hr|human resources|workplace|my company|recruiter|hiring)\b.{0,60}\b(result|results|screening|test|genetic|genes|report|certificate|fit|fitness)\b'}
    - {id: en.emp.2, locale: en, category: employer_insurer, pattern: '\b(result|results|screening|genetic|genes|report|certificate|fitness)\b.{0,60}\b(employer|boss|manager|hr|human resources|workplace|recruiter|hiring)\b'}
