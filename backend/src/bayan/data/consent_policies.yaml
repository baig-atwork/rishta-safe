    - {id: en.oth.1, locale: en, category: other_person_result, pattern: '\b(show|tell|give|send|share) (me )?(my |our )?(partner|spouse|husband|wife|fiance|fiancee|brother|sister|mother|father|cousin|friend|neighbour|neighbor|colleague|in law|daughter|son)s? (genetic )?(result|results|report|genes|variants?|carrier status)\b'}
    - {id: en.oth.2, locale: en, category: other_person_result, pattern: '\b(his|her|their) (genetic )?(result|results|report|genes|variants?|carrier status)\b'}
    - {id: en.oth.3, locale: en, category: other_person_result, pattern: '\b(partner|spouse|husband|wife|fiance|fiancee|brother|sister|cousin|friend|colleague)s (genetic )?(result|results|report|genes|variants?|carrier status)\b'}
    - {id: en.oth.4, locale: en, category: other_person_result, pattern: '\b(what|which) (is|are|was|were) (my |our )?(partner|spouse|husband|wife|fiance|fiancee|brother|sister|cousin|friend)s? (genetic )?(result|results|genes|variants?)\b'}
    # ---------------- Arabic (draft) ----------------
    - {id: ar.dx.1, locale: ar, category: diagnosis, pattern: 'هل (?:انا|اني|ابني|ابنتي|طفلي|ولدي|بنتي|زوجي|زوجتي|خطيبي|خطيبتي|هو|هي)? ?(?:مصاب\w*|مريض\w*)'}
