rules_deliberately_left_out:
- rule: Mentzer, Shine-Lal, England-Fraser, Srivastava, Green-King, RDW-index or any other discriminant formula to label iron deficiency vs thalassaemia trait
  why: BSH-2023 PDF p.7 says such formulae are 'not likely to be reliable in children or pregnant women or in sick patients ... their use is not recommended'; published sensitivity for the same formula ranges from 66 to 100 percent between studies (report section 2); the best-performing index in a 99-article meta-analysis (M/H ratio) needs a specific analyser output and is still 'not high enough for making a definitive diagnosis' (Hoffmann 2015).
- rule: Numeric ferritin cut-off for iron deficiency
  why: NHS, BSH, SITE and TIF say to assess iron status but give no numeric cut-off; WHO ferritin guidance was not read. The engine takes the lab's own flag.
- rule: Any CBC-only output of carrier, not-a-carrier, normal, or disease
  why: No guideline read allows it (see output_vocabulary.forbidden_outputs_unless_a_cited_guideline_allows).
- rule: HbA2 3.0-3.5 percent with normal indices -> silent beta-thal
  why: TIF-OLD says DNA 'in diagnostic cases'; NHS-ANTE says such cases are missed by design. Clinical decision, not an automated rule.
- rule: Sex-specific indices or HbA2 cut-offs
  why: None found in NHS, BSH, TIF or SITE as read.
- rule: HbS, HbC, HbD, HbE trait proportions (30-40 percent and so on) as automated sub-typing
  why: NHS-INTERP s2 says analyser-dependent and requires review; left to a scientist.
- rule: Automated disease-state (affected) classification
  why: No guideline read supports it; compound states need indices, HbA2 and often DNA together (NHS-INTERP s4).
- rule: Pakistani or Saudi premarital algorithm thresholds
  why: No primary algorithm document with numeric thresholds was found; Saudi source gives electrophoresis only; Oman 2018 gives a test panel without cut-offs.
