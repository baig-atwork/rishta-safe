# Closure texts, Arabic. Same keys as closure.en.yaml.
# Status: needs_clinician_signoff: true; language_status: draft (no native clinical reader has looked at this wording).
meta:
  schema_version: 1
  locale: ar
  direction: rtl
  language_status: draft
  needs_clinician_signoff: true
  authoring: "Arabic draft of static text, drafted at authoring time with an LLM assistant. No personal data was given to the assistant. No native clinical reader has reviewed it. No runtime LLM. Items are original wording, except the single literacy-screener question, a CC BY item whose Arabic wording is an unvalidated draft translation."

notices:
  not_run: "هذه هي الأداة والبروتوكول فقط. لم يُجرَ اختبار الفهم مع أشخاص بعد."
  synthetic: "الإجابات هنا خاصة بأشخاص مختلَقين فقط (بيانات اصطناعية). يُرجى عدم إدخال أي تفاصيل صحية أو عائلية حقيقية."
  draft: "هذا النص مسودة. وما زال توقيع المسؤول السريري عليه قيد الانتظار."
  item_level_only: "تُعرض الإجابات سؤالاً سؤالاً. ولا تُحسب درجة إجمالية."
  optional_stratifier: "هذا السؤال اختياري. يُستخدم فقط للمقارنة بين المجموعات. وهو ليس اختباراً لقدرة القراءة."

answer_labels:
  "true": "صحيح"
  "false": "خطأ"
  not_sure: "لستُ على يقين"
  prefer_not_to_say: "أفضّل عدم الإجابة"

scale_labels:
  likert_low: "لا أوافق إطلاقاً"
  likert_high: "أوافق بشدة"

proforma:
  encounter: {label: "الزيارة", help: "التاريخ ونمط الجلسة ومدتها ولغتها، وهل استُعين بمترجم. يملأ النظام الأوقات ثم تؤكدونها."}
  risk_signal: {label: "وقت إصدار النتيجة", help: "يملؤها النظام من سجل المسار."}
  findings_discussed: {label: "النتائج التي جرت مناقشتها", help: "ضعوا علامة أمام كل نتيجة جرت مناقشتها. وبيّنوا هل شُرحت على أنها احتمال وليست تشخيصاً، وهل كانت غير مؤكدة."}
  information_given: {label: "المعلومات المقدَّمة", help: "ضعوا علامة أمام كل نقطة جرى شرحها."}
  options_discussed: {label: "الخيارات التي جرت مناقشتها", help: "ضعوا علامة أمام كل خيار جرى وصفه. الخيارات مرتبة بترتيب ثابت محايد. ولا يُوصى بأي منها."}
  teach_back: {label: "إعادة الشرح من الزوجين", help: "هل شرح الزوجان النتيجة بكلماتهما الخاصة؟ سجّلوا مدى دقة ذلك."}
  patient_questions: {label: "الأسئلة", help: "هل دُعي الزوجان إلى طرح الأسئلة؟ وهل أُجيب عنها؟"}
  plan: {label: "الخطة", help: "لكل إجراء مسؤول وموعد محدد."}
  referral_task: {label: "مهام الإحالة", help: "يملؤها النظام من مهام الإحالة."}
  service_preference: {label: "الخدمات المستقبلية", help: "هذه إجابة الشخص الاختيارية بنفسه. يملؤها الشخص نفسه لا أنتم."}
  sharing_and_consent: {label: "المشاركة والموافقة", help: "هل سُلّمت نسخة إلى الشخص نفسه. ويضيف النظام سجل الموافقة."}
  completed_by: {label: "أُكمل بواسطة", help: "يملؤها النظام: دوركم والوقت."}

