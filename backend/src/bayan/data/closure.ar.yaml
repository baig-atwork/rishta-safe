patient_items:
  own_words:
    prompt: "بكلماتكما الخاصة، ماذا تعني هذه النتيجة لكما؟"
  out_of_100:
    prompt: "من بين {denominator} حملاً لأزواج لديهم هذه النتيجة نفسها، كم طفلاً تقريباً سيكون لديه هذه الحالة؟"
  carrier_is_disease:
    prompt: "كون الشخص حاملاً للتغيّر الجيني يعني أنه مصاب بالمرض."
  negative_means_none:
    prompt: "إذا لم يجد الفحص أي تغيّر مشترك، فلا يمكن أن تكون لدى أطفالنا أي حالة وراثية."
  next_step:
    prompt: "ما الخطوة التالية، ومن المسؤول عنها؟"
    options:
      counsellor_explains: "مستشار أو طبيب يشرح لنا النتيجة والخيارات"
      centre_decides: "مركز الفحص يقرر عنا"
      nothing_more: "لا شيء آخر يحدث"
      find_lab_yourself: "نبحث نحن عن مختبر"
  values_clarity:
    prompt: "أعرف ما هو الأهم بالنسبة إلينا عند اختيار ما سنفعله بعد ذلك."
  felt_free:
    prompt: "شعرتُ بحرية الاختيار. لم يدفعنا أحد في اتجاه معين."
  who_can_see:
    prompt: "من يمكنه الاطلاع على نتيجتنا؟"
    options:
      only_me: "أنا فقط"
      me_and_partner: "أنا وشريكي أو شريكتي"
      family_i_choose: "أفراد من العائلة أختارهم"
      nobody_else: "لا أحد غيري"

sils:
  prompt: "كم مرة تحتاج إلى مساعدة شخص ما عند قراءة التعليمات أو النشرات أو أي مواد مكتوبة أخرى من طبيبك أو صيدليتك؟"
  options:
    never: "أبداً"
    rarely: "نادراً"
    sometimes: "أحياناً"
    often: "غالباً"
    always: "دائماً"
  attribution: "السؤال مأخوذ من مقياس السؤال الواحد لمعرفة القراءة والكتابة (موريس وآخرون)، ويُستخدم بموجب ترخيص المشاع الإبداعي بنسب المصنّف (CC BY). هذه الصياغة العربية مسودة ترجمة لم يُتحقق منها."

service_interest:
  prompt: "هل ترغبان في الحصول على معلومات عن خدمات التخطيط للحمل؟"
  consent_text: "يمكننا أن نرسل إليك معلومات عن خدمات التخطيط للحمل عندما يحين الوقت المناسب لك. من الأمثلة: الاستشارة قبل الحمل، وفحص الشريك أو الأقارب، وخيارات تكوين الأسرة. هذا خيارك أنت. إجابتك لا تغيّر نتيجتك. ولا تُعرض عبر هذه الخدمة على شريكك ولا على عائلتك ولا على جهة عملك ولا على شركة التأمين، ولا نسجّل ما إذا كنت تنوي الزواج. يمكنك أن تقول: ليس الآن، أو: لا، شكراً، ويمكنك تغيير رأيك في أي وقت. وإذا قلت نعم، فلن نستخدم إلا وسيلة التواصل التي تختارها، ولن نستخدمها إلا لإرسال هذه المعلومات."
  values:
    yes_now: "نعم، الآن"
    yes_later: "نعم، لاحقاً (ذكّروني)"
    no_thanks: "لا، شكراً"
    prefer_not_to_say: "أفضّل عدم الإجابة"
  reminder_prompt: "متى ترغب في تلقي تذكير؟ (عدد الأشهر من الآن)"
  topics_prompt: "ما المواضيع التي تهمك؟"
  topics:
    preconception_counselling: "الاستشارة قبل الحمل"
    partner_or_relative_testing: "فحص الشريك أو الأقارب"
    conception_options_information: "معلومات عن خيارات تكوين الأسرة"
    prenatal_testing_information: "معلومات عن الفحوصات أثناء الحمل"
    talk_to_counsellor_again: "التحدث مع مستشار مرة أخرى"

teachback:
  intro: "خمسة أسئلة قصيرة للتأكد من وضوح الشرح. هي تختبر الشرح، لا تختبركما."
  results_note: "تُعرض إجاباتكما مع شرح قصير. ولا توجد درجة فاصلة."
  items:
    sr1:
      prompt: "ماذا تعني النتيجة المشتركة؟"
      options:
        a: "لديكما نتيجة مشتركة تشير إلى احتمال أن يكون لدى طفل ما حالة وراثية"
        b: "أحدكما مريض الآن"
        c: "الزواج غير مسموح به"
      explanation: "النتيجة المشتركة تشير إلى احتمال يخص الطفل. وهي ليست تشخيصاً لأي منكما، وليست حكماً بشأن الزواج."
    sr2:
      prompt: "كون الشخص حاملاً للتغيّر الجيني يعني أنه مريض."
      explanation: "الحامل للتغيّر الجيني لديه نسخة واحدة متغيّرة من الجين. ومعظم الحاملين لا تظهر عليهم أعراض."
    sr3:
      prompt: "يعرض الرسم {denominator} رمزاً. ماذا تمثّل؟"
      options:
        a: "{denominator} حملاً لأزواج لديهم النتيجة نفسها"
        b: "{denominator} من الأزواج في الدولة"
        c: "{denominator} طفلاً ستنجبانهم"
      explanation: "الرسم مبني على {denominator} حملاً. وهو يصف الاحتمال لكل حمل، ولا يبيّن كم طفلاً ستنجبان."
    sr4:
      prompt: "من يقرر ما سيحدث بعد ذلك؟"
      options:
        a: "مركز الفحص يقرر عنكما"
        b: "أنتما تقرران، بدعم من مستشار إن رغبتما في ذلك"
        c: "أقاربكما هم من يقررون"
      explanation: "القرار قراركما. المستشار يشرح الخيارات المتاحة ولا يملي عليكما ما تقرران."
    sr5:
      prompt: "ما الخطوة التالية التي تُعرض عليكما؟"
      options:
        a: "التحدث مع مستشار وراثي أو طبيب مدرَّب"
        b: "الانتظار وعدم إخبار أحد"
        c: "إعادة الفحص في المنزل"
      explanation: "يستطيع المستشار أن يشرح النتيجة والخيارات. ويُجرى الفحص في مراكز مرخّصة، لا في المنزل."
    ns1:
      prompt: "ماذا يعني أنه لم يُعثر على تغيّر مشترك؟"
      options:
        a: "في هذا الفحص، لم يُعثر على تغيّر في الجين نفسه لدى كل منكما"
        b: "لا يمكن أن تكون لدى أطفالكما أي حالة وراثية"
        c: "لا يحمل أي منكما أي تغيّر جيني"
      explanation: "هذا يصف هذا الفحص فقط. فالفحص ينظر في قائمة محددة من الجينات، ولا يستطيع كشف كل التغيّرات. ومعظم الناس يحملون بعض التغيّرات الجينية."
    ns2:
      prompt: "عدم العثور على تغيّر مشترك يعني أنه لا يمكن أن تكون لدى الطفل أي حالة وراثية."
      explanation: "لا يوجد فحص يكشف كل التغيّرات، لذلك فهذه النتيجة ليست وعداً."
    ns3:
      prompt: "لماذا قد لا يكشف الفحص تغيّراً ما؟"
      options:
        a: "لأنه يفحص قائمة محددة من الجينات فقط، ولا يستطيع كشف كل التغيّرات"
        b: "الفحص لا يفوّته أي تغيّر أبداً"
        c: "بسبب خطأ في المختبر فقط"
      explanation: "لكل فحص حدود. ولهذا تُعرض نسبة الكشف."
    ns4:
      prompt: "إذا كان بين الشريكين صلة قرابة، فإن الفحص السلبي يخفّض الاحتمال بالطريقة نفسها كما في حالة شريكين لا تربطهما قرابة."
      explanation: "قد يرث الشريكان القريبان التغيّر نفسه من جد مشترك، فإذا فات الفحصَ هذا التغيّر فإنه يفوته عند كليهما. ولهذا لا يُعرض رقم أصغر."
    ns5:
      prompt: "من يمكنه الاطلاع على نتيجتك؟"
      options:
        a: "أنت، والشريك فقط إذا وافقت"
        b: "جهة عملك"
        c: "شركة التأمين"
      explanation: "لا يُسمح لجهات العمل وشركات التأمين بطلب النتائج الجينية أو استخدامها. ولا يطّلع الشريك على التفاصيل إلا إذا وافقت."
    mi1:
      prompt: "ماذا تعني عبارة «هناك حاجة إلى مزيد من المعلومات»؟"
      options:
        a: "التقرير لا يستطيع إعطاء إجابة واضحة بعد، ويلزم مزيد من الفحص أو المراجعة"
        b: "عُثر على شيء خطير"
        c: "لم يُعثر على شيء"
      explanation: "هذه ليست نتيجة في أي اتجاه. ومعناها أن الإجابة غير واضحة بعد."
    mi2:
      prompt: "«هناك حاجة إلى مزيد من المعلومات» نتيجة مشتركة."
      explanation: "ليست نتيجة مشتركة. وليست نتيجة في أي اتجاه."
    mi3:
      prompt: "ما المقصود بتغيّر جيني غير معروف الدلالة (VUS)؟"
      options:
        a: "تغيّر جيني لا يستطيع الأطباء حتى الآن وصفه بأنه ضار أو غير ضار"
        b: "تغيّر جيني يسبب المرض دائماً"
        c: "تغيّر جيني غير ضار دائماً"
      explanation: "معناه غير معروف بعد. ولا يُحتسب نتيجة، وقد يُفهم بشكل أفضل لاحقاً."
    mi4:
      prompt: "ماذا يحدث بعد ذلك؟"
      options:
        a: "يشرح مختص مؤهَّل أي فحص إضافي أو مراجعة مطلوبة"
        b: "لا شيء، فقد انتهت الحالة"
        c: "يُعاد الفحص في المنزل"
      explanation: "يراجع معكما مختص مؤهَّل التقرير ويشرح الخطوة التالية."
    mi5:
      prompt: "الحاجة إلى مزيد من المعلومات تعني أن أحداً مريض."
      explanation: "تعني أن الإجابة غير واضحة بعد. ولا تعني أن أحداً مريض."
