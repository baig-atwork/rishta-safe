# Rishta Safe condition catalogue (lane A: genetics). SYNTHETIC-DATA PROTOTYPE. NOT a clinical resource.
#
# STATUS: every row, every severity tier and every frequency here needs clinical sign-off before any use
# (needs_clinician_signoff: true). The clinical owner is "the clinical lead (sign-off pending)".
#
# Rules this file follows (docs/spec/00-architecture-and-scope.md section 2):
#  - rule 3: a frequency has a `source_id` plus the wording or figures it came from, or it is `illustrative: true`.
#  - rule 8: no AVDB table, no Jain et al. supplement, no GeneReviews or OMIM text is copied. A handful of
#    published headline numbers are quoted as facts with their citation; nothing else.
#  - severity tiers A/B/C are this build's own coarse grouping. No source assigns them, so every tier is
#    `severity_status: illustrative`. They drive only the staff-only review priority, never what a couple sees.
#
# "read_status" on a source says honestly what this build looked at. "re-read" means the build fetched the
# abstract on 2026-11-20; "as reported" means the figure was taken from the cited source during an earlier authoring
# round and the primary was not re-opened by this build.

version: "0.1-draft"
status: draft_pending_clinical_signoff
needs_clinician_signoff: true
boundary_note: >-
  Education and decision support only, never clinical advice. This catalogue describes a demonstration panel on
  synthetic couples. It is not the Abu Dhabi, Dubai or federal programme gene list.

severity_tier_definitions:
  A: "Usually serious, starts in infancy or childhood, needs lifelong specialist care or can shorten life (illustrative grouping)."
  B: "Serious, but the age of onset or the course varies from person to person (illustrative grouping)."
  C: "Variable, often milder, or shows mainly with triggers or in some carriers (illustrative grouping)."

sources:
