# Pathway texts, English. Same keys in pathway.ar.yaml and pathway.ur.yaml.
# Every external system is labelled simulated in every language. No digits are typed in the
# text (numbers come from pathway.yaml and the case record). No banned word (templates.banned.yaml).
# Status: needs_clinician_signoff: true; language_status: draft (nobody has reviewed this wording).
meta:
  schema_version: 1
  locale: en
  direction: ltr
  language_status: draft
  needs_clinician_signoff: true
  authoring: "Static text drafted at authoring time with an LLM assistant (no personal data); no runtime LLM."

notices:
  simulated: "Every outside system shown on this page is simulated. Nothing is booked, sent or issued."
  synthetic: "All people and results in this prototype are made up (synthetic)."
  draft: "These labels are a draft. The clinical lead's sign-off is pending."
  certificate_expired: "The certificate dates shown here are over. A new one would be needed."
  certificate_valid_until: "Valid until"
  preliminary_risk_off: "A preliminary estimate was not requested."
  preliminary_risk_unavailable: "A preliminary estimate was requested, but this build has no source for it. Nothing is shown."
  stale_task: "This task has had no change for a long time. It is shown here so it is not lost."
  standard_illustrative: "This time limit is illustrative. No published standard states one."

steps:
  registered:
    label: "Book a screening visit"
    description: "Choose a licensed screening centre and a time. In this prototype the booking is simulated and nothing is booked."
  consult_completed:
    label: "Consent and doctor's visit"
    description: "You sign the agreement and meet a doctor, each partner on their own. The doctor asks about your health and family."
  sample_collected:
    label: "Blood sample"
    description: "A trained person takes blood at the centre, during the same visit. Samples go to the laboratories."
  lab_started:
    label: "Laboratory work starts"
    description: "The laboratory receives the sample and starts the tests."
  joint_report_ready:
    label: "Joint report is ready"
    description: "One joint report is prepared for the couple and sent to the doctor. The genetic part takes longer than the other tests."
  result_communicated:
    label: "Result is explained"
    description: "The doctor shares the result. Partners may be contacted separately."
  counselling_booked:
    label: "Counselling is booked"
    description: "If the result needs it, a counselling visit is booked. You can also say no thank you."
  counselling_completed:
    label: "Counselling is done"
    description: "A trained professional explains the result and the choices that exist. They do not tell you what to decide."
  declaration_signed:
    label: "Declaration is signed"
    description: "You sign a statement that the result was explained to you."
  certificate_issued:
    label: "Certificate is issued"
    description: "The screening report that is needed for the marriage contract is issued. It is valid for a limited time."
  judicial_handoff_sent:
    label: "Report goes to the judicial department"
    description: "The report is made available to the judicial department. In this prototype the hand-off is simulated."
  case_closed:
    label: "Case is closed"
    description: "The follow-up steps are finished or have been declined, and the case is closed."

