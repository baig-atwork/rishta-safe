  certificate_valid_until: "صالحة حتى"
  preliminary_risk_off: "لم يُطلب تقدير أولي."
  preliminary_risk_unavailable: "طُلب تقدير أولي، لكن هذه النسخة لا تملك مصدراً له. لا يُعرض شيء."
