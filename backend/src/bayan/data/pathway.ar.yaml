steps:
  registered:
    label: "حجز زيارة فحص"
    description: "تختاران مركز فحص مرخّصاً وموعداً. في هذا النموذج الأولي الحجز تجريبي (محاكاة) ولا يُحجز شيء."
  consult_completed:
    label: "الموافقة وزيارة الطبيب"
    description: "توقّعان على الاتفاقية وتلتقيان بالطبيب، كل واحد منكما على حدة. يسأل الطبيب عن صحتكما وعن عائلتكما."
  sample_collected:
    label: "عيّنة الدم"
    description: "يسحب شخص مدرَّب الدم في المركز، خلال الزيارة نفسها. وتُرسل العيّنات إلى المختبرات."
  lab_started:
    label: "بدء العمل في المختبر"
    description: "يستلم المختبر العيّنة ويبدأ الفحوصات."
  joint_report_ready:
    label: "التقرير المشترك جاهز"
    description: "يُعدّ تقرير مشترك واحد للزوجين ويُرسل إلى الطبيب. ويستغرق الجزء الجيني وقتاً أطول من بقية الفحوصات."
  result_communicated:
    label: "شرح النتيجة"
    description: "يطلعكما الطبيب على النتيجة. وقد يُتواصل مع كل شريك على حدة."
  counselling_booked:
    label: "حجز جلسة الاستشارة"
    description: "إذا اقتضت النتيجة ذلك، تُحجز جلسة استشارة. ويمكنكما أيضاً أن تقولا: لا، شكراً."
  counselling_completed:
    label: "انتهاء الاستشارة"
    description: "يشرح مختص مدرَّب النتيجة والخيارات المتاحة. ولا يملي عليكما ما تقرران."
  declaration_signed:
    label: "توقيع الإقرار"
    description: "توقّعان على إقرار بأن النتيجة شُرحت لكما."
  certificate_issued:
    label: "إصدار الشهادة"
    description: "يُصدر تقرير الفحص المطلوب لعقد الزواج. وهو صالح لمدة محدودة."
  judicial_handoff_sent:
    label: "إرسال التقرير إلى الدائرة القضائية"
    description: "يُتاح التقرير للدائرة القضائية. وفي هذا النموذج الأولي التسليم تجريبي (محاكاة)."
  case_closed:
    label: "إغلاق الملف"
    description: "انتهت خطوات المتابعة أو جرى الاعتذار عنها، وأُغلق الملف."

