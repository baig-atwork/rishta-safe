  authoring: "Arabic draft of static text, drafted at authoring time with an LLM assistant. No personal data was given to the assistant. No native clinical reader has reviewed it. No runtime LLM."

notices:
  simulated: "كل جهة خارجية تظهر في هذه الصفحة هي تجريبية (محاكاة). لا يُحجز شيء ولا يُرسل ولا يُصدر."
  synthetic: "جميع الأشخاص والنتائج في هذا النموذج الأولي مختلَقة (بيانات اصطناعية)."
  draft: "هذه التسميات مسودة. وما زال توقيع المسؤول السريري عليها قيد الانتظار."
