<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 458" width="1200" height="458" role="img" aria-labelledby="t d"><title id="t">Who sees what</title><desc id="d">Couple member, partner, care team, programme operator, national genomic database, employer or insurer (refused), and the audit ledger that records every decision.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#0f1217" stroke-width="2.6"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1217"/></marker></defs><rect width="1200" height="458" fill="#f8f9fb"/><text x="20" y="28" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5361" text-anchor="start" letter-spacing="1.2">WHO</text><text x="390" y="28" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5361" text-anchor="start" letter-spacing="1.2">WHAT THEY SEE</text><rect x="10" y="40" width="800" height="58" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><rect x="24" y="58" width="22" height="22" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="62" y="76" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">You, the couple member</text><text x="390" y="65" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Your own result, unless you</text><text x="390" y="89" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">chose not to know</text><rect x="10" y="104" width="800" height="58" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><rect x="24" y="122" width="22" height="22" fill="none" stroke="#0f1217" stroke-width="1.5" stroke-dasharray="4 3"/><text x="62" y="140" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">Your partner</text><text x="390" y="129" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Only what you share: result only,</text><text x="390" y="153" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">gene names or detail; none by default</text><rect x="10" y="168" width="800" height="58" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><rect x="24" y="186" width="22" height="22" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="62" y="204" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">Counsellor or clinician</text><text x="390" y="193" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Assigned couples only; every</text><text x="390" y="217" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">access is written to the audit log</text><rect x="10" y="232" width="800" height="58" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><rect x="24" y="250" width="22" height="22" fill="#ffffff" stroke="#0f1217" stroke-width="1.5"/><text x="62" y="268" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">Programme operator</text><text x="390" y="257" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Aggregates only,</text><text x="390" y="281" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">no couple result</text><rect x="10" y="296" width="800" height="58" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><rect x="24" y="314" width="22" height="22" fill="url(#hatch)" stroke="#0f1217" stroke-width="1.5"/><text x="62" y="332" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">National genomic database</text><text x="390" y="321" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Receives it by law, Art. 26(2);</text><text x="390" y="345" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">we do not hide it from the state</text><rect x="10" y="360" width="800" height="58" rx="0" fill="#151a22" stroke="#151a22" stroke-width="1.5"/><rect x="24" y="378" width="22" height="22" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="62" y="396" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="start">Employer or insurer</text><text x="390" y="385" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">REFUSED: HTTP 403, Art. 19 to 21,</text><text x="390" y="409" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">refusal logged</text><rect x="836" y="40" width="354" height="378" rx="0" fill="#151a22" stroke="#151a22" stroke-width="1.5"/><text x="856" y="74" font-family="Outfit, Archivo, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff" text-anchor="start">Audit ledger</text><text x="856" y="106" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">Every disclosure decision,</text><text x="856" y="130" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">consent change, refusal</text><text x="856" y="154" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">and escalation, with</text><text x="856" y="178" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">pseudonymous ids</text><rect x="856" y="232" width="30" height="30" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><line x1="886" y1="247" x2="918" y2="247" stroke="#ffffff" stroke-width="1.8"/><rect x="918" y="232" width="30" height="30" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><line x1="948" y1="247" x2="980" y2="247" stroke="#ffffff" stroke-width="1.8"/><rect x="980" y="232" width="30" height="30" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><line x1="1010" y1="247" x2="1042" y2="247" stroke="#ffffff" stroke-width="1.8"/><rect x="1042" y="232" width="30" height="30" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><line x1="1072" y1="247" x2="1104" y2="247" stroke="#ffffff" stroke-width="1.8"/><rect x="1104" y="232" width="30" height="30" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="856" y="300" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">each row holds the SHA-256 of</text><text x="856" y="324" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">its content and the row before</text><text x="856" y="356" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="start">Limit: no external anchor yet</text><line x1="810" y1="69" x2="836" y2="69" stroke="#0f1217" stroke-width="1.5"/><rect x="10" y="428" width="18" height="18" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="38" y="444" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">sees it</text><rect x="145" y="428" width="18" height="18" fill="none" stroke="#0f1217" stroke-width="1.5" stroke-dasharray="4 3"/><text x="173" y="444" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">only if you share</text><rect x="382" y="428" width="18" height="18" fill="url(#hatch)" stroke="#0f1217" stroke-width="1.5"/><text x="410" y="444" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">receives it by law</text><rect x="629" y="428" width="18" height="18" fill="#ffffff" stroke="#0f1217" stroke-width="1.5"/><text x="657" y="444" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">no couple result</text></svg>
