<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d"><title id="t">Data flow of one result</title><desc id="d">A reported result goes to the rules engine, one of three closed categories, the threshold, the disclosure filter, the explainer and checker, then read together, with the audit row each step writes.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#0f1217" stroke-width="2.6"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1217"/></marker></defs><rect width="1200" height="440" fill="#f8f9fb"/><rect x="10" y="14" width="330" height="118" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="24" y="41" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">1  Reported result</text><text x="24" y="66" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">a lab result a licensed</text><text x="24" y="89" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">programme already reported</text><text x="24" y="112" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">(synthetic here)</text><rect x="10" y="138" width="330" height="40" rx="0" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="20" y="149" width="18" height="18" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5"/><text x="48" y="165" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">No audit row: input only</text><rect x="420" y="14" width="330" height="118" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="434" y="41" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">2  Rules engine</text><text x="434" y="66" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">fixed rules, no model;</text><text x="434" y="89" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">one of three closed</text><text x="434" y="112" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">categories (not a scale)</text><rect x="420" y="138" width="330" height="40" rx="0" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="430" y="149" width="18" height="18" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5"/><text x="458" y="165" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">No audit row: computing only</text><rect x="830" y="14" width="330" height="118" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="844" y="41" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">3  Threshold</text><text x="844" y="66" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">four options, none preselected;</text><text x="844" y="89" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">no result text is fetched</text><text x="844" y="112" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">before a choice</text><rect x="830" y="138" width="330" height="40" rx="0" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5"/><rect x="840" y="149" width="18" height="18" fill="#1a51bd" stroke="#1a51bd" stroke-width="1.5"/><text x="868" y="165" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Prefer not to know: 1 row</text><rect x="830" y="214" width="330" height="118" rx="0" fill="#151a22" stroke="#151a22" stroke-width="1.5"/><text x="844" y="241" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="start">4  Disclosure filter</text><text x="844" y="266" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">each person sees only what</text><text x="844" y="289" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">they chose to share;</text><text x="844" y="312" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#c9d1dc" text-anchor="start">counselling-first rule</text><rect x="830" y="338" width="330" height="40" rx="0" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5"/><rect x="840" y="349" width="18" height="18" fill="#1a51bd" stroke="#1a51bd" stroke-width="1.5"/><text x="868" y="365" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Disclose row per request</text><rect x="420" y="214" width="330" height="118" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="434" y="241" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">5  Explainer and checker</text><text x="434" y="266" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">reviewed templates; checker</text><text x="434" y="289" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">re-derives every number;</text><text x="434" y="312" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">refuses on a mismatch</text><rect x="420" y="338" width="330" height="40" rx="0" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="430" y="349" width="18" height="18" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5"/><text x="458" y="365" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">No audit row of its own</text><rect x="10" y="214" width="330" height="118" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="24" y="241" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">6  Read together</text><text x="24" y="266" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">the same text in two</text><text x="24" y="289" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">languages side by side</text><text x="24" y="312" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">(Arabic, Urdu: drafts)</text><rect x="10" y="338" width="330" height="40" rx="0" fill="#ffffff" stroke="#1a51bd" stroke-width="1.5"/><rect x="20" y="349" width="18" height="18" fill="#1a51bd" stroke="#1a51bd" stroke-width="1.5"/><text x="48" y="365" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Disclose row per fetch</text><line x1="340" y1="73" x2="420" y2="73" stroke="#0f1217" stroke-width="1.8" marker-end="url(#arr)"/><line x1="750" y1="73" x2="830" y2="73" stroke="#0f1217" stroke-width="1.8" marker-end="url(#arr)"/><polyline points="1160,73 1180,73 1180,273 1160,273" fill="none" stroke="#0f1217" stroke-width="1.8" marker-end="url(#arr)"/><line x1="830" y1="273" x2="750" y2="273" stroke="#0f1217" stroke-width="1.8" marker-end="url(#arr)"/><line x1="420" y1="273" x2="340" y2="273" stroke="#0f1217" stroke-width="1.8" marker-end="url(#arr)"/><text x="10" y="414" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">Closed vocabulary:</text><rect x="190" y="394" width="225" height="30" rx="0" fill="#ffffff" stroke="#0f1217" stroke-width="1.5"/><text x="202" y="415" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">shared_result_found</text><rect x="429" y="394" width="257" height="30" rx="0" fill="#ffffff" stroke="#0f1217" stroke-width="1.5"/><text x="441" y="415" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">no_shared_change_found</text><rect x="700" y="394" width="267" height="30" rx="0" fill="#ffffff" stroke="#0f1217" stroke-width="1.5"/><text x="712" y="415" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">more_information_needed</text></svg>
