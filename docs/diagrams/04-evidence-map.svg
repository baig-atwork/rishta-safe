<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 466" width="1200" height="466" role="img" aria-labelledby="t d"><title id="t">Evidence map</title><desc id="d">The eleven scoreboard measures as tally cells, weakest figure first; two are not run and are hatched.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#0f1217" stroke-width="2.6"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1217"/></marker></defs><rect width="1200" height="466" fill="#f8f9fb"/><text x="56" y="24" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5361" text-anchor="start" letter-spacing="1.2">ID</text><text x="128" y="24" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5361" text-anchor="start" letter-spacing="1.2">MEASURE</text><text x="540" y="24" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5361" text-anchor="start" letter-spacing="1.2">VALUE</text><text x="870" y="24" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5361" text-anchor="start" letter-spacing="1.2">DOES NOT SHOW</text><rect x="10" y="34" width="1180" height="32" rx="0" fill="#ffffff" stroke="#1a51bd" stroke-width="2.2"/><rect x="20" y="40" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="57" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M6</text><text x="128" y="57" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Refusal, held-out first run</text><text x="540" y="57" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">36 of 59 refused (61%)</text><text x="870" y="57" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Keywords, not meaning</text><rect x="10" y="68" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="74" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="91" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M7</text><text x="128" y="91" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Referral within the standard</text><text x="540" y="91" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">4 of 7 flagged cases (57%)</text><text x="870" y="91" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Simulated pathway</text><rect x="10" y="102" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="108" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="125" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M1</text><text x="128" y="125" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Engine against oracle</text><text x="540" y="125" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">20,000 of 20,000 agree</text><text x="870" y="125" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Same team wrote both</text><rect x="10" y="136" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="142" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="159" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M2</text><text x="128" y="159" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Explanations, 3 languages</text><text x="540" y="159" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">768 documents: numbers 100%</text><text x="870" y="159" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Clarity; Arabic and Urdu</text><rect x="10" y="170" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="176" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="193" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M2b</text><text x="128" y="193" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Checker on injected faults</text><text x="540" y="193" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">5,760 of 5,760 caught</text><text x="870" y="193" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Only the listed faults</text><rect x="10" y="204" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="210" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="227" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M4</text><text x="128" y="227" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Escalation recall</text><text x="540" y="227" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">400 of 400 cases</text><text x="870" y="227" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Cases from the same rules</text><rect x="10" y="238" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="244" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="261" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M5</text><text x="128" y="261" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Disclosure vs reference model</text><text x="540" y="261" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">30,527 decisions, 0 mismatches</text><text x="870" y="261" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Legal completeness</text><rect x="10" y="272" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="278" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="295" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M1b</text><text x="128" y="295" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Random-mating at-risk rate</text><text x="540" y="295" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">2.28% against closed form 2.33%</text><text x="870" y="295" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Not a validation</text><rect x="10" y="306" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="312" width="20" height="20" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="329" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M3</text><text x="128" y="329" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">English readability</text><text x="540" y="329" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Grade 5.3 mean, 6.5 at most</text><text x="870" y="329" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Understanding</text><rect x="10" y="340" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="346" width="20" height="20" fill="url(#hatch)" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="363" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M8</text><text x="128" y="363" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Human comprehension study</text><text x="540" y="363" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">NOT RUN</text><text x="870" y="363" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Any comprehension claim</text><rect x="10" y="374" width="1180" height="32" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><rect x="20" y="380" width="20" height="20" fill="url(#hatch)" stroke="#0f1217" stroke-width="1.5"/><text x="56" y="397" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M9</text><text x="128" y="397" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Clinical review</text><text x="540" y="397" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">NOT RUN</text><text x="870" y="397" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">Any clinical validity</text><rect x="10" y="412" width="18" height="18" fill="#0f1217" stroke="#0f1217" stroke-width="1.5"/><text x="38" y="428" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">measured</text><rect x="150" y="412" width="18" height="18" fill="url(#hatch)" stroke="#0f1217" stroke-width="1.5"/><text x="178" y="428" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">not run</text><rect x="272" y="410" width="36" height="22" rx="0" fill="none" stroke="#1a51bd" stroke-width="2.2"/><text x="316" y="428" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">weakest figure, shown first</text><text x="10" y="458" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f1217" text-anchor="start">M1, M2, M2b, M4 and M5 at 100% are a regression gate, not safety evidence: the same team wrote both sides.</text></svg>
