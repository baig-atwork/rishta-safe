<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 466" width="1200" height="466" role="img" aria-labelledby="t d"><title id="t">One-pathway pilot path</title><desc id="d">Five gates, none yet done, then a shadow pilot beside a licensed facility in which no result reaches a couple through Rishta Safe.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#0f1217" stroke-width="2.6"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1217"/></marker></defs><rect width="1200" height="466" fill="#f8f9fb"/><line x1="40" y1="220" x2="1180" y2="220" stroke="#0f1217" stroke-width="2"/><line x1="1160" y1="220" x2="1190" y2="220" stroke="#0f1217" stroke-width="2" marker-end="url(#arr)"/><rect x="82" y="202" width="36" height="36" fill="none" stroke="#0f1217" stroke-width="1.5" stroke-dasharray="4 3"/><text x="8" y="50" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="start">1  Ethics determination</text><text x="8" y="78" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">the ethics committee</text><text x="8" y="102" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">decides the review</text><text x="8" y="126" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="start">level</text><line x1="100" y1="142" x2="100" y2="202" stroke="#b9c0cb" stroke-width="1.2"/><rect x="282" y="202" width="36" height="36" fill="none" stroke="#0f1217" stroke-width="1.5" stroke-dasharray="4 3"/><text x="300" y="274" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="middle">2  Clinical lead sign-off</text><text x="300" y="302" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">rules, detection rates,</text><text x="300" y="326" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">banned words, triggers,</text><text x="300" y="350" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">proforma</text><line x1="300" y1="238" x2="300" y2="246" stroke="#b9c0cb" stroke-width="1.2"/><rect x="482" y="202" width="36" height="36" fill="none" stroke="#0f1217" stroke-width="1.5" stroke-dasharray="4 3"/><text x="500" y="50" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="middle">3  Native clinical review</text><text x="500" y="78" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">every Arabic and</text><text x="500" y="102" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">Urdu string</text><line x1="500" y1="118" x2="500" y2="202" stroke="#b9c0cb" stroke-width="1.2"/><rect x="682" y="202" width="36" height="36" fill="none" stroke="#0f1217" stroke-width="1.5" stroke-dasharray="4 3"/><text x="700" y="274" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="middle">4  Legal reads</text><text x="700" y="302" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">open readings of</text><text x="700" y="326" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">Federal Decree-Law</text><text x="700" y="350" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">49/2023</text><line x1="700" y1="238" x2="700" y2="246" stroke="#b9c0cb" stroke-width="1.2"/><rect x="882" y="202" width="36" height="36" fill="none" stroke="#0f1217" stroke-width="1.5" stroke-dasharray="4 3"/><text x="900" y="50" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="middle">5  Privacy and risk</text><text x="900" y="78" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">independent privacy audit;</text><text x="900" y="102" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">the facility's AI risk</text><text x="900" y="126" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="middle">assessment</text><line x1="900" y1="142" x2="900" y2="202" stroke="#b9c0cb" stroke-width="1.2"/><rect x="1082" y="202" width="36" height="36" fill="url(#hatch)" stroke="#0f1217" stroke-width="1.5"/><text x="1192" y="274" font-family="Outfit, Archivo, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f1217" text-anchor="end">6  Shadow pilot</text><text x="1192" y="302" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="end">beside a licensed</text><text x="1192" y="326" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="end">facility; staff compare;</text><text x="1192" y="350" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5361" text-anchor="end">no result reaches a couple</text><line x1="1100" y1="238" x2="1100" y2="246" stroke="#b9c0cb" stroke-width="1.2"/><rect x="10" y="372" width="1180" height="86" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.2"/><text x="24" y="398" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Measures: time to counsellor brief, referral within the 90% target, teach-back with intervals, escalation recall.</text><text x="24" y="424" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f1217" text-anchor="start">Never a measure: cancelled marriages. Stop rule: a number that differs from the engine, or a banned word, stops it.</text><text x="24" y="449" font-family="Outfit, Archivo, Arial, sans-serif" font-size="20" font-weight="600" fill="#4a5361" text-anchor="start">Durations are set with the facility; none is stated here.</text></svg>
