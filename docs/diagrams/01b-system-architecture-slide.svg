<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 516" width="1200" height="516" role="img" aria-labelledby="t d"><title id="t">System architecture of Rishta Safe (slide version)</title><desc id="d">People reach a web app, then one API and a composition layer inside a server trust boundary, then six domain packages and versioned data. Employers and insurers are refused. No language model runs at run time.</desc><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#0f1217" stroke-width="2.6"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f1217"/></marker></defs><rect width="1200" height="516" fill="#f8f9fb"/><rect x="16" y="70" width="160" height="50" rx="0" fill="url(#hatch)" stroke="#0f1217" stroke-width="1.5"/><rect x="24" y="77" width="144" height="36" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="28" y="102.0" font-family="Outfit, Archivo, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f1217" text-anchor="start">Employer or insurer</text><rect x="16" y="132" width="160" height="44" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="28" y="161.0" font-family="Outfit, Archivo, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f1217" text-anchor="start">Couple member</text><rect x="16" y="184" width="160" height="44" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="28" y="213.0" font-family="Outfit, Archivo, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f1217" text-anchor="start">Counsellor</text><rect x="16" y="236" width="160" height="44" rx="0" fill="#ffffff" stroke="#b9c0cb" stroke-width="1.5"/><text x="28" y="265.0" font-family="Outfit, Archivo, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f1217